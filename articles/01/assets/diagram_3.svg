<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 720" role="img" aria-labelledby="diagram_3-title diagram_3-desc">
  <title id="diagram_3-title">Benchmark Atlas - 14 weeks</title>
  <desc id="diagram_3-desc">Gantt chart showing a 14-week project plan across Discover, Define, Develop, and Deliver phases.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Time Axis & Labels -->
  <line x1="204" y1="64" x2="1000" y2="64" stroke="#4f5d75" stroke-width="1" opacity="0.3"/>
  
  <line x1="204" y1="64" x2="204" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="204" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Jan 05</text>

  <line x1="260" y1="64" x2="260" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="316" y1="64" x2="316" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="316" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Jan 19</text>

  <line x1="372" y1="64" x2="372" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="428" y1="64" x2="428" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="428" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Feb 02</text>

  <line x1="484" y1="64" x2="484" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="540" y1="64" x2="540" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="540" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Feb 16</text>

  <line x1="596" y1="64" x2="596" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="652" y1="64" x2="652" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="652" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Mar 02</text>

  <line x1="708" y1="64" x2="708" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="764" y1="64" x2="764" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="764" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Mar 16</text>

  <line x1="820" y1="64" x2="820" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="876" y1="64" x2="876" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="876" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Mar 30</text>

  <line x1="932" y1="64" x2="932" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <line x1="988" y1="64" x2="988" y2="680" stroke="rgba(45,49,66,0.05)" stroke-width="1"/>
  <text x="988" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Apr 13</text>

  <!-- Discover Phase -->
  <rect x="16" y="72" width="992" height="176" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="28" y="92" fill="#7a8399" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">DISCOVER</text>
  
  <text x="28" y="112" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Desk research and context scan</text>
  <rect x="204" y="96" width="40" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="252" y="112" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">5d</text>

  <text x="28" y="152" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Fieldwork 24 interviews plus shadowing</text>
  <rect x="244" y="136" width="56" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="308" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">7d</text>

  <text x="28" y="192" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Corpus coding and triangulation</text>
  <rect x="300" y="176" width="32" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="340" y="192" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">4d</text>

  <text x="28" y="232" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Gate 1 evidence audit</text>
  <polygon points="332,222 338,228 332,234 326,228" fill="#4f5d75"/>

  <!-- Define Phase -->
  <rect x="16" y="256" width="992" height="136" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="28" y="276" fill="#7a8399" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">DEFINE</text>
  
  <text x="28" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Affinity synthesis 27 insight cards</text>
  <rect x="372" y="280" width="32" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="412" y="296" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">4d</text>

  <text x="28" y="336" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Current-state journey and blueprint</text>
  <rect x="404" y="320" width="24" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="436" y="336" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">3d</text>

  <text x="28" y="376" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Gate 2 insight sign-off</text>
  <polygon points="428,366 434,372 428,378 422,372" fill="#4f5d75"/>

  <!-- Develop Phase -->
  <rect x="16" y="400" width="992" height="136" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="28" y="420" fill="#7a8399" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">DEVELOP</text>
  
  <text x="28" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Ideation 118 concepts NUF scored</text>
  <rect x="452" y="424" width="32" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="492" y="440" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">4d</text>

  <text x="28" y="480" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Prototyping 3 rounds 12 concepts</text>
  <rect x="484" y="464" width="64" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="556" y="480" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">8d</text>

  <text x="28" y="520" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Gate 3 concept selection</text>
  <polygon points="548,510 554,516 548,522 542,516" fill="#4f5d75"/>

  <!-- Deliver Phase -->
  <rect x="16" y="544" width="992" height="136" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="28" y="564" fill="#7a8399" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.1em">DELIVER</text>
  
  <text x="28" y="584" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Future blueprint and backlog 74 tickets</text>
  <rect x="612" y="568" width="40" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="660" y="584" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">5d</text>

  <!-- Pilot 6 weeks one site (FOCAL) -->
  <text x="28" y="624" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Pilot 6 weeks one site</text>
  <rect x="652" y="608" width="336" height="24" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
  <text x="664" y="624" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Pilot 6 weeks one site (42d)</text>

  <!-- Gate 4 pilot review -->
  <text x="28" y="664" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Gate 4 pilot review</text>
  <polygon points="988,654 994,660 988,666 982,660" fill="#4f5d75"/>

</svg>
