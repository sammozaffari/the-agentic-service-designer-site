<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
    <title id="d4-title">Customer Request Journey</title>
    <desc id="d4-desc">Swimlane diagram showing a five-stage process from aware and trigger through submit, wait, resolve, and close.</desc>
    <defs>
        <style></style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

    <!-- Lane dividers -->
    <line x1="40" y1="80" x2="1120" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <line x1="40" y1="160" x2="1120" y2="160" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="240" x2="1120" y2="240" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="320" x2="1120" y2="320" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="400" x2="1120" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="480" x2="1120" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

    <!-- Actor column divider -->
    <line x1="160" y1="80" x2="160" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

    <!-- Lane labels -->
    <text x="60" y="124" fill="#4f5d75" font-size="9" font-family="'ui-monospace', monospace" font-weight="600" letter-spacing="0.18em">AWARE</text>
    <text x="60" y="204" fill="#4f5d75" font-size="9" font-family="'ui-monospace', monospace" font-weight="600" letter-spacing="0.18em">SUBMIT</text>
    <text x="60" y="284" fill="#4f5d75" font-size="9" font-family="'ui-monospace', monospace" font-weight="600" letter-spacing="0.18em">WAIT</text>
    <text x="60" y="364" fill="#4f5d75" font-size="9" font-family="'ui-monospace', monospace" font-weight="600" letter-spacing="0.18em">RESOLVE</text>
    <text x="60" y="444" fill="#4f5d75" font-size="9" font-family="'ui-monospace', monospace" font-weight="600" letter-spacing="0.18em">CLOSE</text>

    <!-- Arrows (drawn before nodes) -->
    <path d="M 300 120 H 340" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 400 144 V 176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 460 200 H 500" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 620 200 H 660" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- Focal arrows entering and exiting focal nodes -->
    <path d="M 720 224 V 256" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 780 280 H 820" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 880 304 V 336" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 940 360 H 980" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    
    <!-- Normal arrow again -->
    <path d="M 1040 384 V 416" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <!-- J1 -->
    <rect x="180" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="240" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Receives letter</text>
        <text x="240" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">or email</text>

    <!-- J2 -->
    <rect x="340" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="400" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Visits portal</text>
        <text x="400" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">to start request</text>

    <!-- J3 -->
    <rect x="340" y="176" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="400" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Completes</text>
        <text x="400" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">long form</text>

    <!-- J4 -->
    <rect x="500" y="176" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="560" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Photographs docs</text>
        <text x="560" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">as proof</text>

    <!-- J5 -->
    <rect x="660" y="176" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="720" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Submits without</text>
        <text x="720" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">confirmation</text>

    <!-- J6 FOCAL -->
    <rect x="660" y="256" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    
        <text x="720" y="274" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">No status vis.</text>
        <text x="720" y="288" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">for days</text>

    <!-- J7 -->
    <rect x="820" y="256" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="880" y="274" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Calls support</text>
        <text x="880" y="288" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">to check status</text>

    <!-- J8 FOCAL -->
    <rect x="820" y="336" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    
        <text x="880" y="354" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Receives generic</text>
        <text x="880" y="368" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">decision letter</text>

    <!-- J9 -->
    <rect x="980" y="336" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="1040" y="354" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Calls again to</text>
        <text x="1040" y="368" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">decode jargon</text>

    <!-- J10 -->
    <rect x="980" y="416" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    
        <text x="1040" y="434" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Keeps own photo</text>
        <text x="1040" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">archive</text>

</svg>
