  <rect x="204" y="168" width="72" height="272" fill="#f5f5f5"/>
  <rect x="204" y="168" width="72" height="272" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
  <text x="240" y="160" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">68</text>
  <text x="240" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Researcher</text>

