<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="agent-runs-title agent-runs-desc">
  <title id="agent-runs-title">Agent runs by role</title>
  <desc id="agent-runs-desc">Bar chart showing the number of agent runs by role in Benchmark Atlas, total 212 runs. Researcher leads with 68 runs, followed by Synthesizer at 38, Critic Reviewer at 34, Mapper at 30, Ideator at 25, and Presenter at 17.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="80" y="44" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-transform="uppercase" letter-spacing="0.08em">Benchmark Atlas, 212 runs</text>
  <text x="80" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Agent runs by role</text>

  <!-- Gridlines -->
  <line x1="80" y1="120" x2="960" y2="120" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="200" x2="960" y2="200" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="280" x2="960" y2="280" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

  <!-- Y-Axis Line -->
  <line x1="80" y1="120" x2="80" y2="440" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

  <!-- Y-Axis Labels -->
  <text x="72" y="124" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
  <text x="72" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60</text>
  <text x="72" y="284" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
  <text x="72" y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20</text>
  <text x="72" y="444" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

