  <text x="464" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">34</text>
  <text x="464" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Critic</text>
  <text x="464" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text>

  <!-- Bar 4: Mapper -->
  <rect x="540" y="320" width="72" height="120" fill="#f5f5f5"/>
  <rect x="540" y="320" width="72" height="120" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="576" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">30</text>
  <text x="576" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mapper</text>

  <!-- Bar 5: Ideator -->
  <rect x="652" y="340" width="72" height="100" fill="#f5f5f5"/>
  <rect x="652" y="340" width="72" height="100" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="688" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">25</text>
  <text x="688" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ideator</text>

  <!-- Bar 6: Presenter -->
  <rect x="764" y="372" width="72" height="68" fill="#f5f5f5"/>
  <rect x="764" y="372" width="72" height="68" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="800" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">17</text>
  <text x="800" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Presenter</text>
</svg>
