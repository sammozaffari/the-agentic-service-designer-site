<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="diagram_5-title diagram_5-desc">
  <title id="diagram_5-title">Service Blueprint: Milestone Tracker</title>
  <desc id="diagram_5-desc">Service blueprint showing physical evidence, customer actions, frontstage, backstage, and support processes.</desc>
  <defs>
    <style></style>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse"><circle fill="rgba(45,49,66,0.12)" cx="2" cy="2" r="1"></circle></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Lane dividers -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <line x1="40" y1="184" x2="1160" y2="184" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="288" x2="1160" y2="288" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="392" x2="1160" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="496" x2="1160" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="600" x2="1160" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

  <!-- Actor column divider -->
  <line x1="160" y1="80" x2="160" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

  <!-- Lane labels -->
  <text x="60" y="136" fill="#4f5d75" font-size="8" font-weight="500" font-family="'ui-monospace', monospace" letter-spacing="0.18em">EVIDENCE</text>
  <text x="60" y="240" fill="#4f5d75" font-size="8" font-weight="500" font-family="'ui-monospace', monospace" letter-spacing="0.18em">CUSTOMER</text>
  <text x="60" y="344" fill="#4f5d75" font-size="8" font-weight="500" font-family="'ui-monospace', monospace" letter-spacing="0.18em">FRONTSTAGE</text>
  <text x="60" y="448" fill="#4f5d75" font-size="8" font-weight="500" font-family="'ui-monospace', monospace" letter-spacing="0.18em">BACKSTAGE</text>
  <text x="60" y="552" fill="#4f5d75" font-size="8" font-weight="500" font-family="'ui-monospace', monospace" letter-spacing="0.18em">SUPPORT</text>

  <!-- Edges -->
  <!-- 1. C1 -> C2 -->
  <line x1="360" y1="236" x2="580" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 2. C2 -> C3 -->
  <line x1="728" y1="236" x2="764" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 3. E1 -> E2 -->
  <line x1="728" y1="132" x2="764" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 4. F1 -> F2 -->
  <line x1="544" y1="340" x2="948" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 5. B1 -> B2 -->
  <line x1="360" y1="444" x2="948" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 6. U1 -> U2 -->
  <line x1="544" y1="548" x2="580" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 7. C1 -> B1 -->
  <line x1="288" y1="268" x2="288" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 8. B1 -> U1 -->
  <path d="M 288 476 L 288 548 L 396 548" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 9. U1 -> E2 -->
  <path d="M 480 516 L 480 488 L 576 488 L 576 176 L 840 176 L 840 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 10. U1 -> E1 -->
  <path d="M 464 516 L 464 492 L 568 492 L 568 180 L 648 180 L 648 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 11. C2 -> E1 -->
  <line x1="656" y1="204" x2="656" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- 12. C3 -> F2 -->
  <path d="M 840 268 L 840 332 L 948 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 13. U3 -> B2 -->
  <path d="M 840 516 L 840 452 L 948 452" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Nodes -->
  
  <!-- CU: C1 -->
  <rect x="216" y="204" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="288" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Submits request</text>

  <!-- BS: B1 -->
  <rect x="216" y="412" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="288" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Case worker updates</text>
  <text x="288" y="456" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">state in workflow tool</text>

  <!-- SUP: U1 -->
  <rect x="400" y="516" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="472" y="544" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Workflow engine emits</text>
  <text x="472" y="560" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">state events</text>

  <!-- FS: F1 -->
  <rect x="400" y="308" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="472" y="336" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Agent sees same</text>
  <text x="472" y="352" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">tracker</text>

  <!-- CU: C2 -->
  <rect x="584" y="204" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="656" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Views live status</text>

  <!-- EV: E1 -->
  <rect x="584" y="100" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="656" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Milestone tracker</text>
  <text x="656" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">page</text>

  <!-- SUP: U2 -->
  <rect x="584" y="516" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="656" y="544" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Notification service</text>
  <text x="656" y="560" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">sends SMS</text>

  <!-- EV: E2 -->
  <rect x="768" y="100" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="840" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">SMS at each</text>
  <text x="840" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">state change</text>

  <!-- CU: C3 -->
  <rect x="768" y="204" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="840" y="232" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Receives plain-language</text>
  <text x="840" y="248" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">decision</text>

  <!-- SUP: U3 -->
  <rect x="768" y="516" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="840" y="544" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">KPI dashboard tracks</text>
  <text x="840" y="560" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">CES &amp; failure demand</text>

  <!-- FS: F2 -->
  <rect x="952" y="308" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1024" y="336" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Agent sends templated</text>
  <text x="1024" y="352" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">update when stalled</text>

  <!-- BS: B2 (Focal) -->
  <rect x="952" y="412" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="1024" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Exception queue for</text>
  <text x="1024" y="456" fill="#2d3142" font-size="11" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">stalled cases &gt; 5 days</text>

  <!-- Legend -->
  <line x1="40" y1="632" x2="1160" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="648" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="656" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="60" y="664" fill="#4f5d75" font-size="8.5" font-family="'-apple-system', sans-serif">Process step</text>

  <rect x="140" y="656" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="160" y="664" fill="#4f5d75" font-size="8.5" font-family="'-apple-system', sans-serif">Exception / Focal outcome</text>

</svg>
