<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" role="img" aria-labelledby="quadrant-title quadrant-desc">
  <title id="quadrant-title">Stakeholder influence and interest</title>
  <desc id="quadrant-desc">Quadrant chart mapping stakeholders by influence on the y-axis and interest on the x-axis, highlighting the executive sponsor.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="60" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em" text-anchor="start">QUADRANT</text>
  <text x="60" y="80" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif" font-weight="400">Stakeholder influence and interest</text>

  <!-- Axis Lines -->
  <!-- X-axis: 160 to 800 at Y=380. (Width 640. Center=480). -->
  <line x1="160" y1="380" x2="800" y2="380" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <!-- Y-axis: 620 to 140 at X=480. (Height 480. Center=380). -->
  <line x1="480" y1="620" x2="480" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>

  <!-- Axis Labels -->
  <!-- Shorten the arrow enough to leave breathing room for the labels beyond the tips -->
  <text x="816" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">INTEREST</text>
  <text x="480" y="124" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" letter-spacing="0.18em" text-anchor="middle">INFLUENCE</text>

  <!-- Quadrant Tags -->
  <text x="176" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">KEEP SATISFIED</text>
  <text x="784" y="156" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em" text-anchor="end" dominant-baseline="middle">MANAGE CLOSELY</text>
  <text x="176" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">MONITOR</text>
  <text x="784" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em" text-anchor="end" dominant-baseline="middle">KEEP INFORMED</text>

  <!-- Items -->
  <!-- 1. Executive sponsor: [0.75, 0.9] -> (640, 188) -->
  <circle cx="640" cy="188" r="4" fill="#eb6c36"/>
  <text x="652" y="188" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="start">Executive sponsor</text>

  <!-- 2. Operations director: [0.6, 0.85] -> (544, 212) -->
  <circle cx="544" cy="212" r="4" fill="#2d3142"/>
  <text x="556" y="212" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="start">Operations director</text>

  <!-- 3. Frontline team leads: [0.8, 0.45] -> (672, 404) -->
  <circle cx="672" cy="404" r="4" fill="#2d3142"/>
  <text x="660" y="404" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="end">Frontline team leads</text>

  <!-- 4. IT architecture: [0.55, 0.6] -> (512, 332) -->
  <circle cx="512" cy="332" r="4" fill="#2d3142"/>
  <text x="524" y="332" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="start">IT architecture</text>

  <!-- 5. Compliance officer: [0.35, 0.8] -> (384, 236) -->
  <circle cx="384" cy="236" r="4" fill="#2d3142"/>
  <text x="372" y="236" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="end">Compliance officer</text>

  <!-- 6. Customer panel: [0.7, 0.25] -> (608, 500) -->
  <circle cx="608" cy="500" r="4" fill="#2d3142"/>
  <text x="620" y="500" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="start">Customer panel</text>

  <!-- 7. Finance controller: [0.25, 0.65] -> (320, 308) -->
  <circle cx="320" cy="308" r="4" fill="#2d3142"/>
  <text x="308" y="308" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle" text-anchor="end">Finance controller</text>

  <!-- Legend -->
  <line x1="60" y1="672" x2="900" y2="672" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="60" y="694" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em" dominant-baseline="middle">LEGEND</text>

  <circle cx="160" cy="694" r="4" fill="#2d3142"/>
  <text x="172" y="694" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle">Stakeholder</text>

  <circle cx="292" cy="694" r="4" fill="#eb6c36"/>
  <text x="304" y="694" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" dominant-baseline="middle">Priority focus</text>
</svg>
