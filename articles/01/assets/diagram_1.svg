<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-1-title diagram-1-desc">
  <title id="diagram-1-title">Agentic Service Designer Architecture</title>
  <desc id="diagram-1-desc">Architecture diagram showing Human Designer orchestrating Claude Code, which dispatches to a pipeline of Researcher, Synthesizer, Mapper, Ideator, and Presenter, all reviewed by a Critic Reviewer.</desc>
  <defs>
    <style></style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Connections drawn behind nodes -->
  <!-- HD -> ORC -->
  <path d="M 480,104 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- ORC -> RES -->
  <path d="M 416,212 V 216 Q 416,224 408,224 H 128 Q 120,224 120,232 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- ORC -> SYN -->
  <path d="M 448,212 V 232 Q 448,240 440,240 H 308 Q 300,240 300,248 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- ORC -> MAP -->
  <path d="M 480,212 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- ORC -> IDE -->
  <path d="M 512,212 V 232 Q 512,240 520,240 H 652 Q 660,240 660,248 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- ORC -> PRE -->
  <path d="M 544,212 V 216 Q 544,224 552,224 H 832 Q 840,224 840,232 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Pipeline arrows -->
  <path d="M 200,324 H 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 380,324 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 560,312 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 580,336 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- PRE -> HD -->
  <path d="M 860,280 V 80 Q 860,72 852,72 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CRI -> pipeline (dashed) -->
  <path d="M 432,440 V 424 Q 432,416 424,416 H 308 Q 300,416 300,408 V 368" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 464,440 V 368" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 496,440 V 392 Q 496,384 504,384 H 652 Q 660,384 660,376 V 368" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 528,440 V 424 Q 528,416 536,416 H 832 Q 840,416 840,408 V 368" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow Labels -->
  <rect x="348" y="396" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="368" y="404" fill="#7a8399" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

  <rect x="472" y="396" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="492" y="404" fill="#7a8399" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

  <rect x="556" y="364" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="576" y="372" fill="#7a8399" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

  <rect x="664" y="396" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="684" y="404" fill="#7a8399" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

  <!-- Nodes -->
  <!-- HD -->
  <rect x="380" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="404" y="56" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">USER</text>
  <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Human Designer</text>
  <text x="480" y="88" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">owns framing, client</text>

  <!-- ORC (Focal) -->
  <rect x="360" y="140" width="240" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="140" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="368" y="148" width="40" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="388" y="156" fill="#eb6c36" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="480" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Claude Code Orchestrator</text>
  <text x="480" y="192" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">dispatches, integrates</text>

  <!-- RES -->
  <rect x="40" y="280" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="280" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="48" y="288" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="64" y="296" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">ROLE</text>
  <text x="120" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Researcher</text>
  <text x="120" y="332" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">desk research,</text>
  <text x="120" y="344" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">transcript coding,</text>
  <text x="120" y="356" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">survey parsing</text>

  <!-- SYN -->
  <rect x="220" y="280" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="220" y="280" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="228" y="288" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="244" y="296" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">ROLE</text>
  <text x="300" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Synthesizer</text>
  <text x="300" y="332" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">affinity clustering,</text>
  <text x="300" y="344" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">insight cards</text>

  <!-- MAP -->
  <rect x="400" y="280" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="280" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="408" y="288" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="424" y="296" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">ROLE</text>
  <text x="480" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Mapper</text>
  <text x="480" y="332" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">journeys, blueprints,</text>
  <text x="480" y="344" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">ecosystem maps</text>

  <!-- IDE -->
  <rect x="580" y="280" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="580" y="280" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="588" y="288" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="604" y="296" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">ROLE</text>
  <text x="660" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Ideator</text>
  <text x="660" y="332" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">HMW banks,</text>
  <text x="660" y="344" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">concept generation,</text>
  <text x="660" y="356" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">NUF scoring</text>

  <!-- PRE -->
  <rect x="760" y="280" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="760" y="280" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="768" y="288" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="784" y="296" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">ROLE</text>
  <text x="840" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Presenter</text>
  <text x="840" y="332" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">decision memos, decks,</text>
  <text x="840" y="344" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">client-ready narrative</text>

  <!-- CRI -->
  <rect x="360" y="440" width="240" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="440" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="368" y="448" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="392" y="456" fill="#2d3142" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle" letter-spacing="0.08em" opacity="0.8">CRITIC</text>
  <text x="480" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'-apple-system', sans-serif" text-anchor="middle">Critic Reviewer</text>
  <text x="480" y="492" fill="#4f5d75" font-size="8" font-family="'ui-monospace', monospace" text-anchor="middle">adversarial review of every artifact</text>
</svg>
