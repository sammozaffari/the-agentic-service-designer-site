<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="diagram_9-title diagram_9-desc">
  <title id="diagram_9-title">Designer-hours per phase - traditional estimate vs AI-first actual</title>
  <desc id="diagram_9-desc">Bar and line chart comparing traditional estimated designer-hours (bars) versus AI-first actuals (line) across Discover, Define, Develop, and Deliver phases.</desc>
  <defs>
    <style></style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title Area -->
  <text x="40" y="40" fill="#7a8399" font-size="12" font-family="'ui-monospace', monospace" letter-spacing="0.14em">DESIGNER-HOURS PER PHASE</text>
  <text x="40" y="72" fill="#2d3142" font-size="28" font-family="'Georgia', serif">Traditional estimate vs AI-first actual</text>

  <!-- Gridlines -->
  <line x1="80" y1="520" x2="960" y2="520" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <line x1="80" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="280" x2="960" y2="280" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="200" x2="960" y2="200" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="120" x2="960" y2="120" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

  <!-- Y-Axis Line -->
  <line x1="80" y1="120" x2="80" y2="520" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

  <!-- Y-Axis Labels -->
  <text x="72" y="524" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">0</text>
  <text x="72" y="444" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">50</text>
  <text x="72" y="364" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">100</text>
  <text x="72" y="284" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">150</text>
  <text x="72" y="204" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">200</text>
  <text x="72" y="124" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="end">250</text>

  <!-- X-Axis Labels -->
  <text x="200" y="548" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif" font-weight="600" text-anchor="middle">Discover</text>
  <text x="420" y="548" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif" font-weight="600" text-anchor="middle">Define</text>
  <text x="640" y="548" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif" font-weight="600" text-anchor="middle">Develop</text>
  <text x="860" y="548" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif" font-weight="600" text-anchor="middle">Deliver</text>

  <!-- Bars (Traditional Estimate) -->
  <!-- Discover -->
  <rect x="140" y="184" width="120" height="336" fill="#f5f5f5"/>
  <rect x="140" y="184" width="120" height="336" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="200" y="176" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="middle">210</text>

  <!-- Define -->
  <rect x="360" y="328" width="120" height="192" fill="#f5f5f5"/>
  <rect x="360" y="328" width="120" height="192" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="420" y="320" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="middle">120</text>

  <!-- Develop -->
  <rect x="580" y="232" width="120" height="288" fill="#f5f5f5"/>
  <rect x="580" y="232" width="120" height="288" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="640" y="224" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="middle">180</text>

  <!-- Deliver -->
  <rect x="800" y="312" width="120" height="208" fill="#f5f5f5"/>
  <rect x="800" y="312" width="120" height="208" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="860" y="304" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" text-anchor="middle">130</text>

  <!-- Line Series (AI-first Actual) -->
  <polyline points="200,368 420,420 640,332 860,340" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Data point 1: Discover -->
  <circle cx="200" cy="368" r="4" fill="#eb6c36"/>
  <rect x="184" y="376" width="32" height="16" fill="#f5f5f5" rx="2"/>
  <text x="200" y="388" fill="#eb6c36" font-size="12" font-family="'ui-monospace', monospace" font-weight="600" text-anchor="middle">96</text>

  <!-- Data point 2: Define -->
  <circle cx="420" cy="420" r="4" fill="#eb6c36"/>
  <rect x="404" y="428" width="32" height="16" fill="#f5f5f5" rx="2"/>
  <text x="420" y="440" fill="#eb6c36" font-size="12" font-family="'ui-monospace', monospace" font-weight="600" text-anchor="middle">62</text>

  <!-- Data point 3: Develop -->
  <circle cx="640" cy="332" r="4" fill="#eb6c36"/>
  <rect x="624" y="308" width="32" height="16" fill="#f5f5f5" rx="2"/>
  <text x="640" y="320" fill="#eb6c36" font-size="12" font-family="'ui-monospace', monospace" font-weight="600" text-anchor="middle">118</text>

  <!-- Data point 4: Deliver -->
  <circle cx="860" cy="340" r="4" fill="#eb6c36"/>
  <rect x="844" y="348" width="32" height="16" fill="#f5f5f5" rx="2"/>
  <text x="860" y="360" fill="#eb6c36" font-size="12" font-family="'ui-monospace', monospace" font-weight="600" text-anchor="middle">112</text>

  <!-- Legend -->
  <line x1="40" y1="588" x2="960" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="616" fill="#4f5d75" font-size="12" font-family="'ui-monospace', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="140" y="608" width="16" height="12" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1" rx="2"/>
  <text x="164" y="618" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif">Traditional Estimate</text>

  <line x1="360" y1="612" x2="384" y2="612" stroke="#eb6c36" stroke-width="2"/>
  <circle cx="372" cy="612" r="4" fill="#eb6c36"/>
  <text x="396" y="618" fill="#2d3142" font-size="12" font-family="'-apple-system', sans-serif">AI-first Actual</text>
</svg>
