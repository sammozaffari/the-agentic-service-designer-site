<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="process-title process-desc">
  <title id="process-title">Service Design Process Architecture</title>
  <desc id="process-desc">Architecture diagram showing the Discover, Define, Develop, and Deliver phases of service design with their respective modes and gates.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- Page Header -->
  <text x="64" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARCHITECTURE</text>
  <text x="64" y="104" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Service Design Lifecycle</text>
  <line x1="64" y1="128" x2="1216" y2="128" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

  <!-- Legend -->
  <line x1="64" y1="648" x2="1216" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="64" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="144" y="666" width="8" height="8" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="160" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Process Mode</text>
  <line x1="264" y1="669" x2="288" y2="669" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="296" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Gate / Transition</text>
  <line x1="400" y1="669" x2="424" y2="669" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="432" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Continuous Feed</text>

  <!-- ZONES -->
  <!-- Discover -->
  <rect x="176" y="192" width="416" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="360" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="384" y="205" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISCOVER</text>

  <!-- Define -->
  <rect x="688" y="192" width="416" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="872" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="896" y="205" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEFINE</text>

  <!-- Develop -->
  <rect x="688" y="432" width="416" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="868" y="436" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="896" y="445" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEVELOP</text>

  <!-- Deliver -->
  <rect x="176" y="432" width="416" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="356" y="436" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="384" y="445" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DELIVER</text>

  <!-- ARROWS -->
  <!-- D1 -> D2 -->
  <line x1="344" y1="276" x2="424" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- D2 -> F1 (Gate 1) -->
  <line x1="568" y1="276" x2="712" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="584" y="256" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="640" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE 1 EVIDENCE AUDIT</text>

  <!-- F1 -> F2 -->
  <line x1="856" y1="276" x2="936" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- F2 -> V1 (Gate 2) -->
  <line x1="1008" y1="312" x2="1008" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="1016" y="390" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1080" y="399" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE 2 INSIGHT SIGN-OFF</text>

  <!-- V1 -> V2 -->
  <line x1="936" y1="516" x2="856" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- V2 -> L1 (Gate 3) -->
  <line x1="712" y1="516" x2="568" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="572" y="496" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="640" y="505" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE 3 CONCEPT SELECTION</text>

  <!-- L1 -> L2 -->
  <line x1="424" y1="516" x2="344" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- L2 -> D1 (Gate 4) -->
  <line x1="256" y1="480" x2="256" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="136" y="390" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="192" y="399" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE 4 PILOT REVIEW</text>

  <!-- D2 -> L2 (Mode 1 Continuous) -->
  <path d="M 496,312 V 388 Q 496,396 488,396 H 312 Q 304,396 304,404 V 480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="336" y="376" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="400" y="385" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODE 1 SENSE INTENT CONT.</text>

  <!-- NODES -->
  <!-- D1 -->
  <rect x="200" y="240" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="208" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="222" y="255" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="272" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 2</text>
  <text x="272" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KNOW CONTEXT</text>

  <!-- D2 -->
  <rect x="424" y="240" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="432" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="446" y="255" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="496" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 3</text>
  <text x="496" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KNOW PEOPLE</text>

  <!-- F1 -->
  <rect x="712" y="240" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="720" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="734" y="255" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="784" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 4</text>
  <text x="784" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FRAME INSIGHTS</text>

  <!-- F2 -->
  <rect x="936" y="240" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="944" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="958" y="255" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="1008" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Current State</text>
  <text x="1008" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JOURNEY &amp; BLUEPRINT</text>

  <!-- V1 -->
  <rect x="936" y="480" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="944" y="486" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="958" y="495" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="1008" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 5</text>
  <text x="1008" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EXPLORE CONCEPTS</text>

  <!-- V2 -->
  <rect x="712" y="480" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="720" y="486" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="734" y="495" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="784" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 6</text>
  <text x="784" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FRAME SOLUTIONS</text>

  <!-- L1 -->
  <rect x="424" y="480" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="432" y="486" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="446" y="495" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
  <text x="496" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode 7</text>
  <text x="496" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REALIZE OFFERINGS</text>

  <!-- L2 -->
  <rect x="200" y="480" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="208" y="486" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="222" y="495" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="272" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pilot / Rollout</text>
  <text x="272" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EXECUTION</text>
</svg>
