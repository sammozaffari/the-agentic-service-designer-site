<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Who awards each tier of the recognition ladder"><rect width="960" height="430" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Who awards each tier of the recognition ladder</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Six tiers spread across five levels of the organisation, weighted towards the floor.</text><line x1="74" y1="299.0" x2="932" y2="299.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="303.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0</text><line x1="74" y1="245.2" x2="932" y2="245.2" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="249.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">1</text><line x1="74" y1="191.5" x2="932" y2="191.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="195.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2</text><line x1="74" y1="137.8" x2="932" y2="137.8" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="141.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">3</text><line x1="74" y1="84.0" x2="932" y2="84.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="88.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">4</text><rect x="144.8" y="191.5" width="28.0" height="107.5" fill="#4a6b4f"/><text x="158.8" y="185.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">2</text><rect x="316.4" y="245.2" width="28.0" height="53.8" fill="#4a6b4f"/><text x="330.4" y="239.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="488.0" y="245.2" width="28.0" height="53.8" fill="#4a6b4f"/><text x="502.0" y="239.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="659.6" y="245.2" width="28.0" height="53.8" fill="#4a6b4f"/><text x="673.6" y="239.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="831.2" y="245.2" width="28.0" height="53.8" fill="#4a6b4f"/><text x="845.2" y="239.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">1</text><text x="159.8" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Restaurant</text><text x="331.4" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Area leader</text><text x="503.0" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Programme, group</text><text x="674.6" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">System competition</text><text x="846.2" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Support centre</text><text x="28.0" y="361.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Two of the six tiers are awarded inside the restaurant on a daily cadence, so the new behaviours are recognised by the people who actually see</text><text x="28.0" y="378.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">them.</text><text x="28.0" y="397.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the awarded-by column of the recognition ladder table in this case study.</text></svg>