<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="529" viewBox="0 0 1600 529" role="img" aria-label="Service quality: the guest journey with its measures"><rect width="1600" height="529" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">Service quality: the guest journey with its measures</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Five stages from order entry to post-visit feedback across the guest, the backstage systems and the measures. The failure points are the complaint</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">clusters the decomposition located.</text><rect x="190.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 Order entry</text><rect x="468.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Payment</text><rect x="746.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Production and pack</text><rect x="1024.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Handoff</text><rect x="1302.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Post-visit feedback</text><rect x="20" y="110" width="170" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="170" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Guest (frontstage)</text><rect x="190.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="200.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, kiosk, app or drive-thru</text><text x="200.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order entry across four channels; kiosk</text><text x="200.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">friction is the leading entry complaint.</text><rect x="468.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="478.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledged at the till</text><text x="478.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A verbal acknowledgment standard: no silent</text><text x="478.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">queue at a busy till.</text><rect x="746.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="756.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order built, packed, handed over</text><text x="756.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Accuracy is the largest complaint cluster:</text><text x="756.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">missing items and refund friction.</text><rect x="1024.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1034.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, window or delivery pickup</text><text x="1034.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Long waits and understaffing dominate at</text><text x="1034.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">drive-thru and delivery handoff.</text><rect x="1302.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1312.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Invited to give feedback</text><text x="1312.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Most comments arrive without channel</text><text x="1312.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">attribution: the named data gap.</text><line x1="20" y1="233" x2="1580" y2="233" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1576" y="229" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="233" width="170" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Backstage systems</text><rect x="190.0" y="233" width="278.0" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="200.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk routing rules</text><text x="200.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Self-service suggested to card payers</text><text x="200.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">without special discounts; counter first</text><text x="200.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">for cash, seniors and staff.</text><rect x="468.0" y="233" width="278.0" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="478.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Station scripting</text><text x="478.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Acknowledgment and recovery lines per</text><text x="478.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">station; queue abandonment intercepted.</text><rect x="746.0" y="233" width="278.0" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="756.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Pack-check at handoff</text><text x="756.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Visual checklists at drive-thru and</text><text x="756.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">delivery pickup; a fast refund and remake</text><text x="756.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">script.</text><rect x="1024.0" y="233" width="278.0" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1034.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Peak labour planning</text><text x="1034.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Labour-plan review at drive-thru-heavy</text><text x="1034.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">sites; a parked-car waiting board makes the</text><text x="1034.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">wait explicit.</text><rect x="1302.0" y="233" width="278.0" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1312.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Attribution and verified rules</text><text x="1312.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Coding rules shrink the unattributed pool;</text><text x="1312.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">measurement uses verified feedback only.</text><rect x="20" y="331" width="170" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Measures</text><rect x="190.0" y="331" width="278.0" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk-friction theme share</text><text x="200.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order-entry complaints tracked weekly by</text><text x="200.0" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">cluster.</text><rect x="468.0" y="331" width="278.0" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledgment adherence</text><text x="478.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Capability checks on the digital</text><text x="478.0" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">observation form; script adherence scored.</text><rect x="746.0" y="331" width="278.0" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order accuracy</text><text x="756.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Pack-check completion plus the accuracy-</text><text x="756.0" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">theme trend.</text><rect x="1024.0" y="331" width="278.0" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Wait-theme trend</text><text x="1034.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Weekly rank against the prior week, flagged</text><text x="1034.0" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">to area leaders.</text><rect x="1302.0" y="331" width="278.0" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Channel-attribution rate</text><text x="1312.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The unattributed share reported as a named</text><text x="1312.0" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">gap, never dropped.</text><rect x="20" y="414" width="170" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="436" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure points</text><rect x="190.0" y="414" width="278.0" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="200.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 Kiosk friction; combo items</text><text x="200.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">counter-only</text><text x="200.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Bulk items missing from the kiosk menu.</text><rect x="468.0" y="414" width="278.0" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="478.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 No acknowledgment; queue</text><text x="478.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">abandonment</text><text x="478.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Invisible abandonment at the till.</text><rect x="746.0" y="414" width="278.0" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="756.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Missing items; refund friction</text><text x="756.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The accuracy pillar exists because of this.</text><rect x="1024.0" y="414" width="278.0" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1034.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 Long waits; understaffing</text><text x="1034.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Peak labour review is the primary</text><text x="1034.0" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">intervention.</text><rect x="1302.0" y="414" width="278.0" height="85" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1312.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 No channel attribution</text><text x="1312.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Named rather than dropped.</text><text x="20" y="519" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific franchisee group, 2025. Drawn by Sam Mozaffari from the engagement's journey map; vendors, sites and people removed. Rendered September 2026.</text></svg>