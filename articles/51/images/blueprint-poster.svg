<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="608" viewBox="0 0 1100 608" role="img" aria-label="Service quality: the guest journey with its measures"><rect width="1100" height="608" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">Service quality: the guest journey with its measures</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Five stages from order entry to post-visit feedback across the guest, the backstage systems and the</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">measures. The failure points are the complaint clusters the decomposition located.</text><rect x="170.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="180.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 Order entry</text><rect x="352.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="362.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Payment</text><rect x="534.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="544.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Production and pack</text><rect x="716.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="726.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Handoff</text><rect x="898.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="908.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Post-visit feedback</text><rect x="20" y="110" width="150" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="150" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Guest (frontstage)</text><rect x="170.0" y="150" width="182.0" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="180.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, kiosk, app or</text><text x="180.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">drive-thru</text><text x="180.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order entry across four</text><text x="180.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">channels; kiosk friction is</text><text x="180.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">the leading entry complaint.</text><rect x="352.0" y="150" width="182.0" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="362.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledged at the till</text><text x="362.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A verbal acknowledgment</text><text x="362.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">standard: no silent queue at a</text><text x="362.0" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">busy till.</text><rect x="534.0" y="150" width="182.0" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="544.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order built, packed,</text><text x="544.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">handed over</text><text x="544.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Accuracy is the largest</text><text x="544.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">complaint cluster: missing</text><text x="544.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">items and refund friction.</text><rect x="716.0" y="150" width="182.0" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="726.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, window or</text><text x="726.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">delivery pickup</text><text x="726.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Long waits and understaffing</text><text x="726.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">dominate at drive-thru and</text><text x="726.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">delivery handoff.</text><rect x="898.0" y="150" width="182.0" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="908.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Invited to give feedback</text><text x="908.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Most comments arrive without</text><text x="908.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">channel attribution: the named</text><text x="908.0" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">data gap.</text><line x1="20" y1="265" x2="1080" y2="265" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1076" y="261" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="265" width="150" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="287" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Backstage systems</text><rect x="170.0" y="265" width="182.0" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="180.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk routing rules</text><text x="180.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Self-service suggested to card</text><text x="180.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">payers without special</text><text x="180.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">discounts; counter first for</text><text x="180.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">cash, seniors and staff.</text><rect x="352.0" y="265" width="182.0" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="362.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Station scripting</text><text x="362.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Acknowledgment and recovery</text><text x="362.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">lines per station; queue</text><text x="362.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">abandonment intercepted.</text><rect x="534.0" y="265" width="182.0" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="544.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Pack-check at handoff</text><text x="544.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Visual checklists at drive-</text><text x="544.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">thru and delivery pickup; a</text><text x="544.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">fast refund and remake script.</text><rect x="716.0" y="265" width="182.0" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="726.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Peak labour planning</text><text x="726.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Labour-plan review at drive-</text><text x="726.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">thru-heavy sites; a parked-car</text><text x="726.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">waiting board makes the wait</text><text x="726.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">explicit.</text><rect x="898.0" y="265" width="182.0" height="115" fill="#fbfaf6" stroke="#bdbdb7"/><text x="908.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Attribution and verified</text><text x="908.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">rules</text><text x="908.0" y="319" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Coding rules shrink the</text><text x="908.0" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">unattributed pool; measurement</text><text x="908.0" y="349" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">uses verified feedback only.</text><rect x="20" y="380" width="150" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Measures</text><rect x="170.0" y="380" width="182.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="180.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk-friction theme share</text><text x="180.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order-entry complaints tracked</text><text x="180.0" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">weekly by cluster.</text><rect x="352.0" y="380" width="182.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="362.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledgment adherence</text><text x="362.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Capability checks on the</text><text x="362.0" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">digital observation form;</text><text x="362.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">script adherence scored.</text><rect x="534.0" y="380" width="182.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="544.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order accuracy</text><text x="544.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Pack-check completion plus the</text><text x="544.0" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">accuracy-theme trend.</text><rect x="716.0" y="380" width="182.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="726.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Wait-theme trend</text><text x="726.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Weekly rank against the prior</text><text x="726.0" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">week, flagged to area leaders.</text><rect x="898.0" y="380" width="182.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="908.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Channel-attribution rate</text><text x="908.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The unattributed share</text><text x="908.0" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">reported as a named gap, never</text><text x="908.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">dropped.</text><rect x="20" y="478" width="150" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="500" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure points</text><rect x="170.0" y="478" width="182.0" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="180.0" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 Kiosk friction; combo</text><text x="180.0" y="515" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">items counter-only</text><text x="180.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Bulk items missing from the</text><text x="180.0" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">kiosk menu.</text><rect x="352.0" y="478" width="182.0" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="362.0" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 No acknowledgment;</text><text x="362.0" y="515" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">queue abandonment</text><text x="362.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Invisible abandonment at the</text><text x="362.0" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">till.</text><rect x="534.0" y="478" width="182.0" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="544.0" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Missing items; refund</text><text x="544.0" y="515" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">friction</text><text x="544.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The accuracy pillar exists</text><text x="544.0" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">because of this.</text><rect x="716.0" y="478" width="182.0" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="726.0" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 Long waits;</text><text x="726.0" y="515" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">understaffing</text><text x="726.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Peak labour review is the</text><text x="726.0" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">primary intervention.</text><rect x="898.0" y="478" width="182.0" height="100" fill="#fdf3f2" stroke="#bdbdb7"/><text x="908.0" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 No channel</text><text x="908.0" y="515" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">attribution</text><text x="908.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Named rather than dropped.</text><text x="20" y="598" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific franchisee group, 2025. Drawn by Sam Mozaffari from the engagement's journey map; vendors, sites and people removed. Rendered September 2026.</text></svg>