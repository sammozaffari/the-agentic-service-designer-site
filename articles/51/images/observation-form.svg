<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Observation form before and after"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#fff" stroke="none"/><text x="60" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">The observation form, before and after</text><text x="60" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">The manual instrument managers distrusted was killed rather than defended, and redesigned as a five-minute digital check that feeds a dashboard.</text><rect x="60" y="100" width="520" height="600" rx="12" fill="#fafaf7" stroke="#bdbdb7"/><text x="80" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111110" text-anchor="start">Before: the paper audit</text><text x="80" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e69" text-anchor="start">Monthly; scored by the manager; filed; distrusted</text><text x="80" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Customer service score (1 to 10)</text><rect x="80" y="192" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Team attitude (1 to 10)</text><rect x="80" y="244" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="288" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Speed of service (1 to 10)</text><rect x="80" y="296" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Cleanliness (1 to 10)</text><rect x="80" y="348" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Overall impression (1 to 10)</text><rect x="80" y="400" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="444" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">Comments</text><rect x="80" y="452" width="480" height="30" rx="4" fill="#fff" stroke="#bdbdb7"/><text x="80" y="506" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="start">Signed: ______________   Date: ________</text><text x="80" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">• Scores nobody could explain or coach to</text><text x="80" y="558" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">• Speed rated alongside service, so the metric it was meant to change stayed in the form</text><text x="80" y="576" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">• Filed monthly; nothing reached a dashboard or an area leader in time to act</text><rect x="620" y="100" width="520" height="600" rx="12" fill="#fff" stroke="#111110"/><text x="640" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111110" text-anchor="start">After: the five-minute capability check</text><text x="640" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e69" text-anchor="start">Digital; per station; observed behaviours, not impressions; feeds the dashboard</text><text x="640" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4a4a46" text-anchor="start">Station: Pay window   ·   Observer: shift supervisor   ·   Crew: J.</text><text x="640" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Hospitality</text><rect x="644" y="222" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><path d="M647,230 l4,4 l6,-8" stroke="#111110" stroke-width="2" fill="none"/><text x="668" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Acknowledged the guest within seconds</text><rect x="644" y="248" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><text x="668" y="261" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Used the acknowledgment line</text><rect x="644" y="274" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><path d="M647,282 l4,4 l6,-8" stroke="#111110" stroke-width="2" fill="none"/><text x="668" y="287" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Owned the interaction to goodbye</text><text x="640" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Accuracy</text><rect x="644" y="324" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><path d="M647,332 l4,4 l6,-8" stroke="#111110" stroke-width="2" fill="none"/><text x="668" y="337" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Pack-check done in front of the guest</text><rect x="644" y="350" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><text x="668" y="363" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Bag counted aloud</text><text x="640" y="382" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Taste</text><rect x="644" y="400" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><path d="M647,408 l4,4 l6,-8" stroke="#111110" stroke-width="2" fill="none"/><text x="668" y="413" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Look check before handoff</text><rect x="644" y="426" width="16" height="16" rx="3" fill="#fff" stroke="#111110"/><text x="668" y="439" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Remake called for a box that did not pass</text><rect x="640" y="458" width="480" height="54" rx="8" fill="#f4f3ee" stroke="none"/><text x="652" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111110" text-anchor="start">Recognise this crew member</text><text x="652" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a46" text-anchor="start">Hospitality hero pin  ·  logged to the weekly area report</text><text x="640" y="538" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f4d35" text-anchor="start">• Observed behaviours a supervisor can coach to on the spot</text><text x="640" y="556" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f4d35" text-anchor="start">• Speed is not on the form; it is measured elsewhere</text><text x="640" y="574" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f4d35" text-anchor="start">• Weekly report to area leaders; high scorers earn recognition</text><text x="60" y="736" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Concept rendering drawn September 2026 from the 2025 measurement design; the vendor form is not reproduced.</text></svg>