<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-label="Hospitality values framework: three pillars and per-station standards"><rect x="0" y="0" width="1200" height="1080" rx="0" fill="#fff" stroke="none"/><text x="60" y="60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">ONE HOSPITALITY VALUES FRAMEWORK</text><text x="60" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111110" text-anchor="start">Three pillars, every station, one script each</text><text x="60" y="126" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a4a46" text-anchor="start">Consolidates four competing customer-experience frameworks into one that teams can name. Speed stays out by decision: doing it right first time is faster overall.</text><rect x="60.0" y="160" width="346.6666666666667" height="300" rx="12" fill="#f4f3ee" stroke="#bdbdb7"/><text x="78.0" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111110" text-anchor="start">Hospitality</text><text x="78.0" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6e6e69" text-anchor="start">Be proactive, be safe, be you</text><text x="78.0" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Standard</text><text x="78.0" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Acknowledge every guest within seconds.</text><text x="78.0" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Never leave a guest unanswered at the till</text><text x="78.0" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">or the window. Own the interaction from</text><text x="78.0" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">greeting to goodbye.</text><text x="78.0" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Script</text><text x="78.0" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">At the speaker: "That's two boxes and two</text><text x="78.0" y="376" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">drinks, correct?" To a frustrated guest: "We</text><text x="78.0" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">heard you. Here is what happens next."</text><rect x="426.6666666666667" y="160" width="346.6666666666667" height="300" rx="12" fill="#fff" stroke="#bdbdb7"/><text x="444.6666666666667" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111110" text-anchor="start">Accuracy</text><text x="444.6666666666667" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6e6e69" text-anchor="start">Know it all, make sure the guest gets it all</text><text x="444.6666666666667" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Standard</text><text x="444.6666666666667" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Pack-check at handoff. Visual checklists at</text><text x="444.6666666666667" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">drive-thru and delivery pickup. A fast</text><text x="444.6666666666667" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">remake and refund script for missed items.</text><text x="444.6666666666667" y="326" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Script</text><text x="444.6666666666667" y="344" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">At handoff: "Here is everything: boxes,</text><text x="444.6666666666667" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">sides, sauces." On a miss: remake and refund</text><text x="444.6666666666667" y="376" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">without friction, and confirm the</text><text x="444.6666666666667" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">replacement before the guest leaves.</text><rect x="793.3333333333334" y="160" width="346.6666666666667" height="300" rx="12" fill="#fff" stroke="#bdbdb7"/><text x="811.3333333333334" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111110" text-anchor="start">Taste</text><text x="811.3333333333334" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6e6e69" text-anchor="start">Looks good, tastes good</text><text x="811.3333333333334" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Standard</text><text x="811.3333333333334" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Presentation check before handoff.</text><text x="811.3333333333334" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Temperature and build check at the pack</text><text x="811.3333333333334" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">screen. A remake standard for anything that</text><text x="811.3333333333334" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">does not pass.</text><text x="811.3333333333334" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Script</text><text x="811.3333333333334" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Kitchen line: "Re-fire that box, it does not</text><text x="811.3333333333334" y="376" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">pass the look check." Handoff: "Fresh from</text><text x="811.3333333333334" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">the kitchen, enjoy."</text><text x="60" y="490" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111110" text-anchor="start">Per-station standards</text><rect x="60" y="512" width="1080" height="32" rx="6" fill="#f4f3ee" stroke="#bdbdb7"/><text x="76" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6e6e69" text-anchor="start">Station</text><text x="300" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6e6e69" text-anchor="start">Standard</text><text x="760" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6e6e69" text-anchor="start">Example script</text><rect x="60" y="544" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Drive-thru order taker</text><text x="300" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Verbal confirmation of the whole order before payment</text><text x="760" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"That's two boxes and two drinks, correct?"</text><rect x="60" y="574" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Pay window</text><text x="300" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Acknowledgment; tap-and-go ready; never a silent queue</text><text x="760" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"We've got you. Your order is being packed now."</text><rect x="60" y="604" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="626" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Counter</text><text x="300" y="626" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Greet within seconds; acknowledge even in a rush</text><text x="760" y="626" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"Welcome, what can we get you today?"</text><rect x="60" y="634" width="1080" height="46" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="656" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Kiosk</text><text x="300" y="656" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Suggest self-service only to card payers without special discounts;</text><text x="300" y="672" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">never make a guest feel wrong for choosing the counter</text><text x="760" y="656" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Kiosk pitch line plus the counter-first rule for cash,</text><text x="760" y="672" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">seniors and staff</text><rect x="60" y="680" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="702" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Pickup and handoff</text><text x="300" y="702" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Pack-check in front of the guest; count the bag</text><text x="760" y="702" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"Here is everything: boxes, sides, sauces."</text><rect x="60" y="710" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="732" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Delivery pickup</text><text x="300" y="732" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Visual checklist; verify the bag before the driver leaves</text><text x="760" y="732" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"Bag verified. Items and sauces in."</text><rect x="60" y="740" width="1080" height="30" rx="0" fill="#fff" stroke="#bdbdb7"/><text x="76" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Parked cars</text><text x="300" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Waiting board by plate; name the wait explicitly</text><text x="760" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">"We'll bring it out when it's ready. Plate 42."</text><text x="60" y="1054" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Hospitality values framework card, drawn September 2026 from the 2025 proposals. Drawn; not the employer's published material.</text></svg>