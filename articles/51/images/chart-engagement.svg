<svg xmlns="http://www.w3.org/2000/svg" width="960" height="282" viewBox="0 0 960 282" role="img" aria-label="The sixteen-week design engagement, phase by phase"><rect width="960" height="282" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">The sixteen-week design engagement, phase by phase</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Coding the corpus took the longest single block, because the taxonomy had to be argued before anything could be counted.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Research and coding</text><rect x="296" y="90" width="491.7" height="16" rx="2" fill="#3f5a7a"/><text x="795.7" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5 wks</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Decomposition and synthesis</text><rect x="296" y="120" width="295.0" height="16" rx="2" fill="#3f5a7a"/><text x="599.0" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3 wks</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Framework and standards</text><rect x="296" y="150" width="393.3" height="16" rx="2" fill="#3f5a7a"/><text x="697.3" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Measurement, trial and rollout design</text><rect x="296" y="180" width="393.3" height="16" rx="2" fill="#3f5a7a"/><text x="697.3" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="230.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Three of the sixteen weeks went on the decomposition, which is the analysis that redirected the whole programme.</text><text x="28.0" y="249.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline as stated in this case study: weeks 1 to 5, 6 to 8, 9 to 12 and 13 to 16.</text></svg>