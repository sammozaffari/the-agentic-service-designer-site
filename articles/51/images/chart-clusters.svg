05.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f3f3b">Kiosk friction</text><rect x="463.6" y="296" width="10" height="10" rx="2" fill="#3f5a7a"/><text x="479.6" y="305.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f3f3b">Waits and understaffing</text><rect x="648.8000000000001" y="296" width="10" height="10" rx="2" fill="#4a6b4f"/><text x="664.8" y="305.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f3f3b">No acknowledgment at the till</text><text x="28.0" y="338.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Drive-thru and delivery each carry two clusters, which is why the handoff got a pack-check and a labour review rather than more scripting.</text><text x="28.0" y="357.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Mapped from the findings and the failure points in this case study; the underlying counts are held by the programme.</text></svg>