<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-label="Decision brief: which experience to blueprint first"><rect x="0" y="0" width="1200" height="1250" rx="0" fill="#fff" stroke="none"/><text x="60" y="70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">DECISION BRIEF</text><text x="1140" y="70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="end">Team-member experience programme · for the franchise governance forum</text><text x="60" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#111110" text-anchor="start">Which experience do we blueprint first?</text><text x="60" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4a46" text-anchor="start">Three asks became one problem. Two fully designed options are on the table. Four decisions are requested.</text><text x="60" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">The problem in one line</text><text x="60" y="199" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">Same training materials, same standards, same menu, and one restaurant runs disengaged while another runs at two-thirds engaged. The difference is who</text><text x="60" y="216" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">is standing on the shift and how that person's week was built. Three separate asks (a holistic view of the crew experience, one definition of the</text><text x="60" y="233" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">restaurant-manager role, relief on turnover) describe one attrition chain.</text><rect x="60" y="264" width="1080" height="64" rx="8" fill="#f4f3ee" stroke="none"/><text x="76" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Unprepared start</text><text x="193.6" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">→</text><text x="215.6" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Inconsistent hours and skill mix</text><text x="438.79999999999995" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">→</text><text x="460.79999999999995" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Pressured shifts</text><text x="578.4" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">→</text><text x="600.4" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Inconsistent support and recognition</text><text x="850.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">→</text><text x="872.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Limited progress</text><text x="989.6" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">→</text><text x="1011.6" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111110" text-anchor="start">Avoidable attrition</text><text x="60" y="358" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">The options</text><rect x="60.0" y="378" width="346.6666666666667" height="300" rx="10" fill="#fff" stroke="#bdbdb7"/><text x="76.0" y="406" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111110" text-anchor="start">Option A: the first twelve weeks</text><text x="76.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">A bounded study of the entry experience from</text><text x="76.0" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">offer to week twelve, as the first</text><text x="76.0" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">blueprint. Strongest claim to boundedness:</text><text x="76.0" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">one cohort you can follow, measure and pilot</text><text x="76.0" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">as a unit.</text><text x="76.0" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">Risk: a checklist, a buddy and a check-in</text><text x="76.0" y="535" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">will not overcome inconsistent hours, weak</text><text x="76.0" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">skill mix, poor manager behaviour or broken</text><text x="76.0" y="565" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">equipment.</text><rect x="426.6666666666667" y="378" width="346.6666666666667" height="300" rx="10" fill="#fff" stroke="#bdbdb7"/><text x="442.6666666666667" y="406" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111110" text-anchor="start">Option B: the healthy shift</text><text x="442.6666666666667" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">The recurring shift experience (opens,</text><text x="442.6666666666667" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">peaks, changeovers, closes, weekends,</text><text x="442.6666666666667" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">promotions) as the first blueprint.</text><text x="442.6666666666667" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Strongest claim to reach: the largest</text><text x="442.6666666666667" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">population, the most repeated controllable</text><text x="442.6666666666667" y="510" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">issues, and the direct link to the rostering</text><text x="442.6666666666667" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">root cause.</text><text x="442.6666666666667" y="552" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">Risk: scope expansion into a review of every</text><text x="442.6666666666667" y="567" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">restaurant process; coverage is the failure</text><text x="442.6666666666667" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">mode.</text><rect x="793.3333333333334" y="378" width="346.6666666666667" height="300" rx="10" fill="#fff" stroke="#bdbdb7"/><text x="809.3333333333334" y="406" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111110" text-anchor="start">Option C: manager enablement</text><text x="809.3333333333334" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Not a competing first blueprint but a</text><text x="809.3333333333334" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">parallel workstream for assistant managers,</text><text x="809.3333333333334" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">the squeezed middle carrying responsibility</text><text x="809.3333333333334" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">without the authority, resources, coaching</text><text x="809.3333333333334" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">or clarity to succeed.</text><text x="809.3333333333334" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">Risk: treated as another engagement campaign</text><text x="809.3333333333334" y="535" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a1f18" text-anchor="start">rather than an operating-model change.</text><text x="60" y="708" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Recommended sequence, and the reasons</text><text x="60" y="732" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">Option B first, with Option A as a targeted follow-on and Option C running alongside from the start. Six reasons: the larger population; the most</text><text x="60" y="749" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">repeated controllable issues; it gets underneath the onboarding findings; it aligns with the labour, rostering and role-design work already funded; it</text><text x="60" y="766" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">links team-member experience to customer and business results in the same scorecard; and it brings the employee value proposition to life</text><text x="60" y="783" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">operationally.</text><rect x="60" y="810" width="1080" height="54" rx="8" fill="#f4f3ee" stroke="none"/><text x="76" y="832" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">The decision line</text><text x="76" y="852" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#111110" text-anchor="start">The first twelve weeks tells us how well we bring people into the network. The healthy shift tells us what they experience every time they come back.</text><text x="60" y="894" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Decisions requested</text><rect x="60" y="914" width="1080" height="44" rx="8" fill="#fff" stroke="#bdbdb7"/><text x="78" y="941" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">1</text><text x="100" y="941" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Adopt the attrition chain as the programme's problem statement, replacing the three separate asks.</text><rect x="60" y="966" width="1080" height="44" rx="8" fill="#fff" stroke="#bdbdb7"/><text x="78" y="993" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">2</text><text x="100" y="993" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Sequence the work as B, then A, with C in parallel; fund the first blueprint's field study.</text><rect x="60" y="1018" width="1080" height="44" rx="8" fill="#fff" stroke="#bdbdb7"/><text x="78" y="1045" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">3</text><text x="100" y="1045" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Embed team-member experience in the restaurant and area scorecard alongside customer experience and business growth.</text><rect x="60" y="1070" width="1080" height="44" rx="8" fill="#fff" stroke="#bdbdb7"/><text x="78" y="1097" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">4</text><text x="100" y="1097" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Adopt the strongly-agree reading discipline for every survey readout, with sub-threshold scores treated as action thresholds.</text><text x="60" y="1134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">What the evidence cannot say</text><text x="60" y="1158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">The anonymous survey cannot be joined to individual exit records, so cohort-level voice is linked to operating records only in the pilot. High intent-</text><text x="60" y="1175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">to-stay among managers is treated as a masking risk: retention alone never counts as evidence of role health. Every headline carries the strongly-</text><text x="60" y="1192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">agree caveat; variation between best and worst restaurant is reported beside every average.</text><text x="60" y="1222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Decision brief drawn September 2026 from the 2026 options paper. Concept rendering of the document the forum received; figures withheld.</text></svg>