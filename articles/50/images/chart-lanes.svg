<svg xmlns="http://www.w3.org/2000/svg" width="960" height="413" viewBox="0 0 960 413" role="img" aria-label="What each lane commits across the twelve weeks"><rect width="960" height="413" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">What each lane commits across the twelve weeks</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Every management layer carries a named commitment at every stage, so no stage depends on goodwill.</text><line x1="74" y1="299.0" x2="932" y2="299.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="303.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0</text><line x1="74" y1="245.2" x2="932" y2="245.2" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="249.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2</text><line x1="74" y1="191.5" x2="932" y2="191.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="195.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">4</text><line x1="74" y1="137.8" x2="932" y2="137.8" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="141.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">6</text><line x1="74" y1="84.0" x2="932" y2="84.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="88.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">8</text><rect x="130.5" y="137.8" width="28.0" height="161.2" fill="#a8781c"/><text x="144.5" y="131.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">6</text><rect x="273.5" y="137.8" width="28.0" height="161.2" fill="#a8781c"/><text x="287.5" y="131.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">6</text><rect x="416.5" y="137.8" width="28.0" height="161.2" fill="#a8781c"/><text x="430.5" y="131.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">6</text><rect x="559.5" y="137.8" width="28.0" height="161.2" fill="#a8781c"/><text x="573.5" y="131.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">6</text><rect x="702.5" y="191.5" width="28.0" height="107.5" fill="#a8781c"/><text x="716.5" y="185.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">4</text><rect x="845.5" y="137.8" width="28.0" height="161.2" fill="#a8781c"/><text x="859.5" y="131.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">6</text><text x="145.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Crew, frontstage</text><text x="288.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Assistant manager</text><text x="431.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Restaurant manager</text><text x="574.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Above-store and</text><text x="574.5" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">support</text><text x="717.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Measures</text><text x="860.5" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Failure points</text><text x="28.0" y="361.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Four checkpoints carry the whole twelve weeks: day-one readiness, then week two, week six and week twelve.</text><text x="28.0" y="380.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the frontstage journey by backstage owners blueprint in this case study.</text></svg>