<svg xmlns="http://www.w3.org/2000/svg" width="960" height="312" viewBox="0 0 960 312" role="img" aria-label="The twenty-week engagement, phase by phase"><rect width="960" height="312" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">The twenty-week engagement, phase by phase</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">From first survey read to a decision in a franchise governance forum.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Research and baseline</text><rect x="286" y="90" width="400.0" height="16" rx="2" fill="#3f5a7a"/><text x="694.0" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Synthesis and the attrition chain</text><rect x="286" y="120" width="400.0" height="16" rx="2" fill="#3f5a7a"/><text x="694.0" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Blueprint and personas</text><rect x="286" y="150" width="500.0" height="16" rx="2" fill="#3f5a7a"/><text x="794.0" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5 wks</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Options and study designs</text><rect x="286" y="180" width="500.0" height="16" rx="2" fill="#3f5a7a"/><text x="794.0" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5 wks</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Decision paper and forum</text><rect x="286" y="210" width="200.0" height="16" rx="2" fill="#3f5a7a"/><text x="494.0" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="260.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Half the engagement sits after the fieldwork, in the synthesis and in designing the choice the forum had to make.</text><text x="28.0" y="279.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline as stated in this case study: weeks 0 to 4, 5 to 8, 9 to 13, 14 to 18 and 19 to 20.</text></svg>