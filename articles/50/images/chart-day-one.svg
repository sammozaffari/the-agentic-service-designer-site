<svg xmlns="http://www.w3.org/2000/svg" width="960" height="413" viewBox="0 0 960 413" role="img" aria-label="What the day-one standard makes checkable"><rect width="960" height="413" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">What the day-one standard makes checkable</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Every line in the standard is a yes or no that somebody owns, rather than an intention.</text><line x1="74" y1="299.0" x2="932" y2="299.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="303.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0</text><line x1="74" y1="245.2" x2="932" y2="245.2" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="249.2" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2</text><line x1="74" y1="191.5" x2="932" y2="191.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="195.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">4</text><line x1="74" y1="137.8" x2="932" y2="137.8" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="141.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">6</text><line x1="74" y1="84.0" x2="932" y2="84.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="88.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">8</text><rect x="166.2" y="164.6" width="28.0" height="134.4" fill="#23231f"/><text x="180.2" y="158.6" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">5</text><rect x="380.8" y="218.4" width="28.0" height="80.6" fill="#23231f"/><text x="394.8" y="212.4" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">3</text><rect x="595.2" y="218.4" width="28.0" height="80.6" fill="#23231f"/><text x="609.2" y="212.4" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">3</text><rect x="809.8" y="164.6" width="28.0" height="134.4" fill="#23231f"/><text x="823.8" y="158.6" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">5</text><text x="181.2" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Gates before the first shift</text><text x="395.8" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">First-shift steps</text><text x="610.2" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Structured check-ins</text><text x="824.8" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Measures on the standard</text><text x="28.0" y="361.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Five gates decide whether a new starter is ready before they arrive, and five measures say whether the twelve weeks happened.</text><text x="28.0" y="380.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the day-one readiness standard, EX-DAY1-001, as written in this case study.</text></svg>