<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="629" viewBox="0 0 1600 629" role="img" aria-label="The automated drive-thru: four human touchpoints around a machine voice"><rect width="1600" height="629" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">The automated drive-thru: four human touchpoints around a machine voice</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Five moments from the speaker box to the waiting bay, with what the guest experiences, what the voice-AI does, what the crew are trained to do, and</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">the measure at each. The failure risks are where automation removed a human moment without replacing it.</text><rect x="190.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 Order point</text><rect x="468.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Voice-AI handoff</text><rect x="746.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Payment window</text><rect x="1024.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Pick-up window</text><rect x="1302.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Waiting bay</text><rect x="20" y="110" width="170" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="170" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Guest (frontstage)</text><rect x="190.0" y="150" width="278.0" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="200.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Speaks the order to a machine</text><text x="200.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The one guaranteed human moment of the</text><text x="200.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">channel, gone.</text><rect x="468.0" y="150" width="278.0" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="478.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Struggles or is misheard</text><text x="478.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The moment frustration starts if nobody</text><text x="478.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">steps in.</text><rect x="746.0" y="150" width="278.0" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="756.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Meets the first person</text><text x="756.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Eye contact, a greeting, the order</text><text x="756.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">confirmed, the receipt with the survey</text><text x="756.0" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">link.</text><rect x="1024.0" y="150" width="278.0" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="1034.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Collects the order</text><text x="1034.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Accuracy confirmed aloud; a farewell.</text><rect x="1302.0" y="150" width="278.0" height="98" fill="#ffffff" stroke="#bdbdb7"/><text x="1312.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Waits for fresh product</text><text x="1312.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">An honest wait time, order recall by plate,</text><text x="1312.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">a surprise moment.</text><rect x="20" y="248" width="170" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Crew (frontstage)</text><rect x="190.0" y="248" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="200.0" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Listens on the headset; reads back with</text><text x="200.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">warmth</text><text x="200.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Friendly tone, active listening, never</text><text x="200.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">robotic.</text><rect x="468.0" y="248" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="478.0" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Takes over before frustration</text><text x="478.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A light line about the machine still</text><text x="478.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">learning, then a natural takeover.</text><rect x="746.0" y="248" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="756.0" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Greets, confirms, makes small talk in</text><text x="756.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">delays</text><text x="756.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">'Anything else while we get that ready for</text><text x="756.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">you?'</text><rect x="1024.0" y="248" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1034.0" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Confirms accuracy visually and aloud;</text><text x="1034.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">progress updates; sincere farewell</text><text x="1034.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">'Fresh chips are about thirty seconds</text><text x="1034.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">away.'</text><rect x="1302.0" y="248" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1312.0" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Names the wait up front; updates;</text><text x="1312.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">delight-hour token</text><text x="1312.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">'About five minutes for fresh chicken.'</text><text x="1312.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Every guest treated like family.</text><line x1="20" y1="348" x2="1580" y2="348" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1576" y="344" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="348" width="170" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Voice-AI and systems</text><rect x="190.0" y="348" width="278.0" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Takes the spoken order; confirmation</text><text x="200.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">screen</text><text x="200.0" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Shows the order back to the guest.</text><rect x="468.0" y="348" width="278.0" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Alerts crew by headset when a guest</text><text x="478.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">needs help</text><text x="478.0" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The trigger for the takeover script.</text><rect x="746.0" y="348" width="278.0" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order to the till; receipt printed with</text><text x="756.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">the survey link</text><text x="756.0" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The measurement channel.</text><rect x="1024.0" y="348" width="278.0" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kitchen display; order timing</text><text x="1034.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Fresh-product timers drive the wait.</text><rect x="1302.0" y="348" width="278.0" height="85" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Waiting-bay recall by plate</text><text x="1312.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order tied to the vehicle.</text><rect x="20" y="433" width="170" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="30" y="455" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Measures</text><rect x="190.0" y="433" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="200.0" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order accuracy; read-back adherence</text><text x="200.0" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Mystery-shopper score on the touchpoint</text><text x="200.0" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">behaviours.</text><rect x="468.0" y="433" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="478.0" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Takeover before a complaint</text><text x="478.0" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Handoff latency observed; complaint rate</text><text x="478.0" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">about the voice.</text><rect x="746.0" y="433" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="756.0" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Greeting and confirmation adherence</text><text x="756.0" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Mystery-shopper score; friendliness</text><text x="756.0" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">mentions.</text><rect x="1024.0" y="433" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="1034.0" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Accuracy confirmed; farewell given</text><text x="1034.0" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Accuracy-theme trend; friendliness</text><text x="1034.0" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">mentions.</text><rect x="1302.0" y="433" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="1312.0" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Wait named; token coverage in the hour</text><text x="1312.0" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Bay comments; mystery-shopper check.</text><rect x="20" y="516" width="170" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="538" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure risks</text><rect x="190.0" y="516" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="200.0" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 Robotic read-back</text><text x="200.0" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Crew mirror the machine's cadence.</text><rect x="468.0" y="516" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="478.0" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 Late takeover</text><text x="478.0" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The guest is already frustrated when a</text><text x="478.0" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">person appears.</text><rect x="746.0" y="516" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="756.0" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Silent window</text><text x="756.0" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Payment without a greeting; the receipt</text><text x="756.0" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">handed without a word.</text><rect x="1024.0" y="516" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1034.0" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 Accuracy not confirmed</text><text x="1034.0" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A wrong order discovered at home.</text><rect x="1302.0" y="516" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1312.0" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 Unexplained wait</text><text x="1312.0" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A parked car with no time and no recall.</text><text x="20" y="619" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific, late 2024 to early 2025. Drawn by Sam Mozaffari from the programme's journey map and training cards; vendors, sites and people removed. Rendered September 2026.</text></svg>