<svg xmlns="http://www.w3.org/2000/svg" width="960" height="342" viewBox="0 0 960 342" role="img" aria-label="Fourteen weeks, six phases"><rect width="960" height="342" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Fourteen weeks, six phases</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Research first, pilots last, with a gate between every pair.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Research</text><rect x="238" y="90" width="194.4" height="16" rx="2" fill="#cfcec7"/><text x="440.4" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3 wks</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Synthesis</text><rect x="238" y="120" width="129.6" height="16" rx="2" fill="#cfcec7"/><text x="375.6" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Mapping and touchpoints</text><rect x="238" y="150" width="129.6" height="16" rx="2" fill="#cfcec7"/><text x="375.6" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Training design</text><rect x="238" y="180" width="129.6" height="16" rx="2" fill="#cfcec7"/><text x="375.6" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Pilot one</text><rect x="238" y="210" width="194.4" height="16" rx="2" fill="#3f5a7a"/><text x="440.4" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3 wks</text><text x="28.0" y="253.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Pilot two</text><rect x="238" y="240" width="129.6" height="16" rx="2" fill="#3f5a7a"/><text x="375.6" y="253.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="290.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">No ideation before the insight cards passed the challenge session, and no second pilot before the first pilot's weekly reports were reviewed.</text><text x="28.0" y="309.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline and gates, section 7 of this case study.</text></svg>