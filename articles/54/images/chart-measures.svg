<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-label="Twelve measures across three layers"><rect width="960" height="408" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Twelve measures across three layers</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">A baseline to compare against, leading measures that move in the hour, lagging measures that decide the rollout.</text><line x1="74" y1="294.0" x2="932" y2="294.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="298.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0</text><line x1="74" y1="241.5" x2="932" y2="241.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="245.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2.5</text><line x1="74" y1="189.0" x2="932" y2="189.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">5</text><line x1="74" y1="136.5" x2="932" y2="136.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="140.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">7.5</text><line x1="74" y1="84.0" x2="932" y2="84.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="88.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">10</text><rect x="202.0" y="231.0" width="28.0" height="63.0" fill="#23231f"/><text x="216.0" y="225.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">3</text><rect x="488.0" y="210.0" width="28.0" height="84.0" fill="#23231f"/><text x="502.0" y="204.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">4</text><rect x="774.0" y="189.0" width="28.0" height="105.0" fill="#23231f"/><text x="788.0" y="183.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">5</text><text x="217.0" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Baselines</text><text x="503.0" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Leading</text><text x="789.0" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Lagging</text><text x="28.0" y="356.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Period-over-period cuts separate the two pilots, and throughput sits in the acceptance criteria so a speed cost would show.</text><text x="28.0" y="375.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the measurement frame in section 6 of this case study.</text></svg>