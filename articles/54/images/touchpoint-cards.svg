<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Two touchpoint training cards: payment window and waiting bay"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#fff" stroke="none"/><text x="60" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111110" text-anchor="start">Touchpoint training cards: the payment window and the waiting bay</text><text x="60" y="70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">Two of the five cards, at the size a crew member would see them. Each card is one touchpoint: the behaviours, one script they can make their own, and what not to do.</text><rect x="60" y="96" width="530" height="560" rx="14" fill="#fff" stroke="#111110"/><rect x="60" y="96" width="530" height="50" rx="14" fill="#111110" stroke="none"/><rect x="60" y="124" width="530" height="22" fill="#111110"/><text x="78" y="127" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">PAYMENT WINDOW</text><text x="572" y="127" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#d8d8d3" text-anchor="end">Touchpoint 3 of 5</text><text x="78" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Do</text><rect x="80" y="188" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="102" y="199" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Eye contact and a real greeting before you touch</text><text x="102" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">the terminal</text><rect x="80" y="228" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="102" y="239" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Confirm the order back, item by item</text><rect x="80" y="252" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="102" y="263" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Small talk while the kitchen catches up: the wait</text><text x="102" y="279" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">is the conversation</text><rect x="80" y="292" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="102" y="303" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Hand the receipt over and point out the survey</text><text x="102" y="319" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">link</text><text x="78" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Say it your way</text><rect x="78" y="342" width="494" height="64" rx="8" fill="#f4f3ee" stroke="none"/><text x="90" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">"Anything else while we get that ready for you?"</text><text x="78" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Not this</text><text x="78" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a1f18" text-anchor="start">Taking payment in silence. Reading the screen instead of</text><text x="78" y="457" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a1f18" text-anchor="start">the guest. Handing the receipt without a word.</text><text x="78" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="start">Practice in the pre-shift huddle · scored on the mystery-shopper visit</text><rect x="610" y="96" width="530" height="560" rx="14" fill="#fff" stroke="#111110"/><rect x="610" y="96" width="530" height="50" rx="14" fill="#111110" stroke="none"/><rect x="610" y="124" width="530" height="22" fill="#111110"/><text x="628" y="127" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">WAITING BAY</text><text x="1122" y="127" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#d8d8d3" text-anchor="end">Touchpoint 5 of 5</text><text x="628" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Do</text><rect x="630" y="188" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="652" y="199" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Name the wait up front, in minutes, before they</text><text x="652" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">park</text><rect x="630" y="228" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="652" y="239" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Recall the order by number plate, not by asking</text><text x="652" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">again</text><rect x="630" y="268" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="652" y="279" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Update them if it changes; do not let the wait go</text><text x="652" y="295" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">quiet</text><rect x="630" y="308" width="13" height="13" rx="3" fill="#fff" stroke="#111110"/><text x="652" y="319" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">In the delight hour, the token goes out with the</text><text x="652" y="335" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">receipt, before the guest asks for anything</text><text x="628" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Say it your way</text><rect x="628" y="358" width="494" height="64" rx="8" fill="#f4f3ee" stroke="none"/><text x="640" y="382" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">"It'll be about five minutes for fresh chicken. We'll</text><text x="640" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110" text-anchor="start">bring it straight out."</text><text x="628" y="440" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Not this</text><text x="628" y="458" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a1f18" text-anchor="start">A parked car with no time and no update. A gesture used as</text><text x="628" y="473" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a1f18" text-anchor="start">an apology after a complaint.</text><text x="628" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="start">Practice in the pre-shift huddle · scored on the mystery-shopper visit</text><text x="60" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Concept rendering drawn September 2026 from the programme's per-touchpoint training behaviours and paraphrased scripts. The cards are the design; no crew are shown.</text></svg>