<svg xmlns="http://www.w3.org/2000/svg" width="960" height="312" viewBox="0 0 960 312" role="img" aria-label="Eighteen trained behaviours across five moments"><rect width="960" height="312" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Eighteen trained behaviours across five moments</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The payment window carries the most, because it is where the guest meets the first person.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Payment window</text><rect x="278" y="90" width="304.0" height="16" rx="2" fill="#9b3427"/><text x="590.0" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Order point, speaker box</text><rect x="278" y="120" width="243.2" height="16" rx="2" fill="#9b3427"/><text x="529.2" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Waiting bay</text><rect x="278" y="150" width="243.2" height="16" rx="2" fill="#9b3427"/><text x="529.2" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Pick-up window</text><rect x="278" y="180" width="182.4" height="16" rx="2" fill="#9b3427"/><text x="468.4" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Order point, voice-AI handoff</text><rect x="278" y="210" width="121.6" height="16" rx="2" fill="#9b3427"/><text x="407.6" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2</text><text x="28.0" y="260.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Each moment also carries one script line crew may adapt, so the behaviour is trainable, observable and recognisable.</text><text x="28.0" y="279.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the touchpoint table in section 5 of this case study.</text></svg>