e" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">2</text><rect x="365.4" y="273.0" width="28.0" height="21.0" fill="#cfcec7"/><text x="379.4" y="267.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">1</text><rect x="488.0" y="273.0" width="28.0" height="21.0" fill="#cfcec7"/><text x="502.0" y="267.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">1</text><rect x="610.6" y="273.0" width="28.0" height="21.0" fill="#cfcec7"/><text x="624.6" y="267.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">1</text><rect x="733.1" y="273.0" width="28.0" height="21.0" fill="#cfcec7"/><text x="747.1" y="267.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">1</text><rect x="855.7" y="273.0" width="28.0" height="21.0" fill="#cfcec7"/><text x="869.7" y="267.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">1</text><text x="135.3" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">1 Onboard</text><text x="257.9" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">2 Roster</text><text x="380.4" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">3 Clock in</text><text x="503.0" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">4 Break</text><text x="625.6" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">5 Pay period</text><text x="748.1" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">6 Correct</text><text x="870.7" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">7 Report</text><text x="28.0" y="356.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Rostering carries two: paper deployment charts transcribed twice a day, and leave entered shift by shift. Every other stage carries one.</text><text x="28.0" y="375.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">The failure-points lane of the four-lane blueprint, section 5 of this case study.</text></svg>