chor="middle">4</text><rect x="595.2" y="204.0" width="28.0" height="80.0" fill="#23231f"/><text x="609.2" y="198.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">4</text><rect x="809.8" y="124.0" width="28.0" height="160.0" fill="#23231f"/><text x="823.8" y="118.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">8</text><text x="181.2" y="302.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Research</text><text x="395.8" y="302.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Synthesis</text><text x="610.2" y="302.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Mapping</text><text x="824.8" y="302.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Prioritisation and reconciliation</text><text x="28.0" y="346.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Half the engagement was research and half was the work of making the result defensible.</text><text x="28.0" y="365.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline and gates, section 7 of this case study.</text></svg>