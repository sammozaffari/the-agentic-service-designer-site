<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" role="img" aria-label="Who owns each of the top ten"><rect width="960" height="335" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Who owns each of the top ten</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The scored top ten, cross-tabulated by the design principle it carries and where it already sat on the vendor's backlog.</text><text x="387.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Already planned</text><text x="605.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Solvable, unplanned</text><text x="823.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Outside platform scope</text><text x="28.0" y="127.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Few hard stops, visible warnings</text><rect x="280.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.62"/><text x="387.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><rect x="498.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="605.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><rect x="716.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="823.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><text x="28.0" y="161.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Crew can see their own record</text><rect x="280.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.36"/><text x="387.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="498.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.36"/><text x="605.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="716.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="823.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><text x="28.0" y="195.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">One view per person</text><rect x="280.0" y="178" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="387.0" y="195.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><rect x="498.0" y="178" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.62"/><text x="605.0" y="195.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><rect x="716.0" y="178" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="823.0" y="195.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><text x="28.0" y="229.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Remove a workaround</text><rect x="280.0" y="212" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="387.0" y="229.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><rect x="498.0" y="212" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.88"/><text x="605.0" y="229.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><rect x="716.0" y="212" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.36"/><text x="823.0" y="229.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><text x="28.0" y="266.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Three items were already on the vendor's calendar and were fast-tracked. Six were solvable but unplanned, which is where the negotiation</text><text x="28.0" y="283.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">happened. One sat outside the platform and became a business process.</text><text x="28.0" y="302.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">The scored top ten, section 5 of this case study.</text></svg>