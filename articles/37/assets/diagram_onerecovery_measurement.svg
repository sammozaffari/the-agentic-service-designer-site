<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="onerecovery-measurement-title onerecovery-measurement-desc">
  <title id="onerecovery-measurement-title">OneRecovery measurement charts</title>
  <desc id="onerecovery-measurement-desc">Three illustrative charts comparing current and pilot targets for safe-reroute minutes, repeated explanations, and accessible trip completion.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
    <text x="32" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">A8 · MEASUREMENT</text>
  <text x="32" y="68" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Illustrative movement, not a live pilot</text>
  <line x1="32" y1="84" x2="1248" y2="84" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="48" y="160" width="360" height="320" rx="6" fill="#f5f5f5"/>
<rect x="48" y="160" width="360" height="320" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="58" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Safe-reroute minutes</text>
<text x="58" y="198" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">52 → 32</text>
<text x="58" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">unit minutes</text>
<rect x="128" y="264" width="72" height="156" fill="#4f5d75"/>
<rect x="248" y="324" width="72" height="96" fill="#eb6c36"/>
<text x="164" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NOW</text>
<text x="284" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PILOT</text>
<text x="164" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">52</text>
<text x="284" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">32</text>
<rect x="448" y="160" width="360" height="320" rx="6" fill="#f5f5f5"/>
<rect x="448" y="160" width="360" height="320" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="458" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Repeated explanations</text>
<text x="458" y="198" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">3 → 2</text>
<text x="458" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">unit contacts</text>
<rect x="528" y="285" width="72" height="135" fill="#4f5d75"/>
<rect x="648" y="330" width="72" height="90" fill="#eb6c36"/>
<text x="564" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NOW</text>
<text x="684" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PILOT</text>
<text x="564" y="277" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3</text>
<text x="684" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2</text>
<rect x="848" y="160" width="360" height="320" rx="6" fill="#f5f5f5"/>
<rect x="848" y="160" width="360" height="320" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="858" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Accessible completion</text>
<text x="858" y="198" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">61% → 88%</text>
<text x="858" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">unit percent</text>
<rect x="928" y="311" width="72" height="109" fill="#4f5d75"/>
<rect x="1048" y="262" width="72" height="158" fill="#eb6c36"/>
<text x="964" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NOW</text>
<text x="1084" y="440" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PILOT</text>
<text x="964" y="303" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">61</text>
<text x="1084" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">88</text>
<line x1="32" y1="600" x2="1248" y2="600" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="616" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
<text x="144" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Current baseline</text>
<rect x="320" y="616" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
<text x="344" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Illustrative pilot target</text>
</svg>
