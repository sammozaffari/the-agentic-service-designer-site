<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="838" viewBox="0 0 1600 838" role="img" aria-label="Learning platform: the as-is ecosystem blueprint"><rect width="1600" height="838" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">Learning platform: the as-is ecosystem blueprint</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Six systems hand-shaking beneath the learner across six lifecycle stages. The scoping workshop mapped the journey one system at a time; the failure</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">points are where the business case's ticket classes came from.</text><rect x="190.0" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 User creation</text><rect x="421.66666666666663" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="431.66666666666663" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Login</text><rect x="653.3333333333333" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="663.3333333333333" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Navigation</text><rect x="885.0" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="895.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Enrolment</text><rect x="1116.6666666666665" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1126.6666666666665" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Launch and completion</text><rect x="1348.3333333333333" y="110" width="231.66666666666666" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1358.3333333333333" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">6 Reporting</text><rect x="20" y="110" width="170" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="170" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">HR system</text><rect x="190.0" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="200.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Account link fails at creation</text><text x="200.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The largest ticket class, raised</text><text x="200.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">before the learner ever logged in.</text><rect x="421.66666666666663" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="431.66666666666663" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="653.3333333333333" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="663.3333333333333" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="885.0" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="895.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1116.6666666666665" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1126.6666666666665" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1348.3333333333333" y="150" width="231.66666666666666" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1358.3333333333333" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="20" y="233" width="170" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Recruiting platform</text><rect x="190.0" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="200.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Profile hand-off</text><text x="200.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The new-hire record must reach the</text><text x="200.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">learning systems; failures strand</text><text x="200.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">access.</text><rect x="421.66666666666663" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="431.66666666666663" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="653.3333333333333" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="663.3333333333333" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="885.0" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="895.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1116.6666666666665" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1126.6666666666665" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1348.3333333333333" y="233" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1358.3333333333333" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><line x1="20" y1="331" x2="1580" y2="331" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1576" y="327" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="331" width="170" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Identity and single</text><text x="30" y="369" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">sign-on</text><rect x="190.0" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="421.66666666666663" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="431.66666666666663" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Dual sign-in paths</text><text x="431.66666666666663" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Two routes into the same content;</text><text x="431.66666666666663" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">forgotten-path tickets.</text><rect x="653.3333333333333" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="663.3333333333333" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="885.0" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="895.0" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1116.6666666666665" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1126.6666666666665" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1348.3333333333333" y="331" width="231.66666666666666" height="83" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1358.3333333333333" y="351" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="20" y="414" width="170" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="30" y="436" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Legacy front end</text><rect x="190.0" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="200.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="421.66666666666663" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="431.66666666666663" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="653.3333333333333" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="663.3333333333333" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Unfiltered content wall</text><text x="663.3333333333333" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Every course visible to every</text><text x="663.3333333333333" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">learner: wrong completions, training</text><text x="663.3333333333333" y="481" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">on equipment the store lacks.</text><rect x="885.0" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="895.0" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">No sequencing at enrolment</text><text x="895.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Everything available on day one:</text><text x="895.0" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">wrong-order and skipped training.</text><rect x="1116.6666666666665" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="1126.6666666666665" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1348.3333333333333" y="414" width="231.66666666666666" height="98" fill="#eeede7" stroke="#bdbdb7"/><text x="1358.3333333333333" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="20" y="512" width="170" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Learning back end</text><rect x="190.0" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="200.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="421.66666666666663" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="431.66666666666663" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="653.3333333333333" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="663.3333333333333" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="885.0" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="895.0" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1116.6666666666665" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="1126.6666666666665" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Completions not recorded across</text><text x="1126.6666666666665" y="549" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">systems</text><text x="1126.6666666666665" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Marked complete on one system,</text><text x="1126.6666666666665" y="581" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">missing on the other: certification</text><text x="1126.6666666666665" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">gaps.</text><rect x="1348.3333333333333" y="512" width="231.66666666666666" height="115" fill="#ffffff" stroke="#bdbdb7"/><text x="1358.3333333333333" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Reporting limited to one role</text><text x="1358.3333333333333" y="549" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">No oversight, no expiry tracking, no</text><text x="1358.3333333333333" y="564" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">audit trail for recertification.</text><rect x="20" y="627" width="170" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="649" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">People platform</text><rect x="190.0" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="200.0" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">No age data fed in</text><text x="200.0" y="664" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Age-restricted training ungated;</text><text x="200.0" y="679" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">interim confirmation gate while the</text><text x="200.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">data fix lands.</text><rect x="421.66666666666663" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="431.66666666666663" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="653.3333333333333" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="663.3333333333333" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="885.0" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="895.0" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1116.6666666666665" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1126.6666666666665" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="1348.3333333333333" y="627" width="231.66666666666666" height="98" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1358.3333333333333" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110"></text><rect x="20" y="725" width="170" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="747" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure points</text><rect x="190.0" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="200.0" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 Account links</text><text x="200.0" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Tickets before the first login.</text><rect x="421.66666666666663" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="431.66666666666663" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 Dual sign-in</text><text x="431.66666666666663" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Confusion and forgotten-path tickets.</text><rect x="653.3333333333333" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="663.3333333333333" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Content wall</text><text x="663.3333333333333" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Wrong completions; wrong-equipment</text><text x="663.3333333333333" y="777" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">certification.</text><rect x="885.0" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="895.0" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 No sequencing</text><text x="895.0" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Skipped and wrong-order training.</text><rect x="1116.6666666666665" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1126.6666666666665" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 Sync failures</text><text x="1126.6666666666665" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Certification gaps and progression</text><text x="1126.6666666666665" y="777" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">delays.</text><rect x="1348.3333333333333" y="725" width="231.66666666666666" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1358.3333333333333" y="745" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-06 Reporting rights</text><text x="1358.3333333333333" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">No oversight; no audit trail.</text><text x="20" y="828" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific, 2024 to 2025. Drawn by Sam Mozaffari from the scoping workshop output; vendors and people removed. Rendered September 2026.</text></svg>