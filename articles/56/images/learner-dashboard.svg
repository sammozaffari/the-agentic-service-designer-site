Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="start">Was due yesterday.</text><rect x="351" y="504" width="65" height="22" rx="11" fill="#fbeae8" stroke="none" stroke-width="1"/><text x="383.5" y="519" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b3261e" text-anchor="middle">Overdue</text><rect x="80" y="570" width="350" height="70" rx="10" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="94" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Age-restricted equipment</text><text x="94" y="616" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="start">Confirm you are 18 or over to start.</text><rect x="323" y="584" width="93" height="22" rx="11" fill="#e8efff" stroke="none" stroke-width="1"/><text x="369.5" y="599" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Confirm age</text><rect x="80" y="650" width="350" height="70" rx="10" fill="#fafaf7" stroke="#bdbdb7" stroke-width="1"/><text x="94" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6e6e69" text-anchor="start">Open procedures certification</text><text x="94" y="696" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="start">Locked until front counter and kitchen are complete.</text><rect x="358" y="664" width="58" height="22" rx="11" fill="#f4f3ee" stroke="none" stroke-width="1"/><text x="387.0" y="679" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">Locked</text><text x="80" y="820" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e69" text-anchor="start">* mandatory</text><rect x="310" y="808" width="120" height="26" rx="13" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="370" y="825" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#111110" text-anchor="middle">Show completed</text><line x1="458" y1="136" x2="510" y2="136" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="136" r="3" fill="#1d4ed8"/><text x="520" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Assigned-only view: a new hire sees the path for their</text><text x="520" y="156" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">role and station, not the whole catalogue.</text><line x1="458" y1="175" x2="510" y2="175" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="175" r="3" fill="#1d4ed8"/><text x="520" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Seven tabs; Assigned is the default. Due and Overdue are</text><text x="520" y="195" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">filters, not separate systems.</text><line x1="458" y1="230" x2="510" y2="230" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="230" r="3" fill="#1d4ed8"/><text x="520" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Progress against the role path. Sequence and gates come</text><text x="520" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">from the journey configuration.</text><line x1="458" y1="290" x2="510" y2="290" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="290" r="3" fill="#1d4ed8"/><text x="520" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Lock sequencing: day 2 unlocks 24 hours after induction.</text><line x1="458" y1="370" x2="510" y2="370" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="370" r="3" fill="#1d4ed8"/><text x="520" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Due and overdue indicators; the mandatory asterisk marks</text><text x="520" y="390" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">legislative and safety items.</text><line x1="458" y1="580" x2="510" y2="580" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="580" r="3" fill="#1d4ed8"/><text x="520" y="584" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Interim age gate: the learner confirms minimum age until</text><text x="520" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">age data is fed from the people platform.</text><line x1="458" y1="660" x2="510" y2="660" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="660" r="3" fill="#1d4ed8"/><text x="520" y="664" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Prerequisite badge: the certification stays locked until</text><text x="520" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">both stations are complete. Badges can be revoked, with an</text><text x="520" y="696" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">audit trail.</text><line x1="458" y1="818" x2="510" y2="818" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="458" cy="818" r="3" fill="#1d4ed8"/><text x="520" y="822" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">Completed items hide by default; a toggle shows them.</text><text x="60" y="886" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Learner dashboard for the compliance-gated learning journey. Built September 2026 from the 2025 journey-gate configuration.</text></svg>