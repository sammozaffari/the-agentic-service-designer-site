<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-label="Fourteen measures across four layers"><rect width="960" height="408" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Fourteen measures across four layers</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">A support-cost baseline, pilot measures the franchisees could see, and lagging measures that decide the network-wide call.</text><line x1="74" y1="294.0" x2="932" y2="294.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="298.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0</text><line x1="74" y1="241.5" x2="932" y2="241.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="245.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2.5</text><line x1="74" y1="189.0" x2="932" y2="189.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">5</text><line x1="74" y1="136.5" x2="932" y2="136.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="140.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">7.5</text><line x1="74" y1="84.0" x2="932" y2="84.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="88.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">10</text><rect x="166.2" y="252.0" width="28.0" height="42.0" fill="#23231f"/><text x="180.2" y="246.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">2</text><rect x="380.8" y="231.0" width="28.0" height="63.0" fill="#23231f"/><text x="394.8" y="225.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">3</text><rect x="595.2" y="210.0" width="28.0" height="84.0" fill="#23231f"/><text x="609.2" y="204.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">4</text><rect x="809.8" y="189.0" width="28.0" height="105.0" fill="#23231f"/><text x="823.8" y="183.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">5</text><text x="181.2" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Baselines</text><text x="395.8" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Pilot measures</text><text x="610.2" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Drivers</text><text x="824.8" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Lagging</text><text x="28.0" y="356.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Self-direction and findability had no baseline at all, so the pilot survey created one.</text><text x="28.0" y="375.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the measurement frame in section 6 of this case study.</text></svg>