<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Kiosk placement floor plan with the foyer host position"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#fff" stroke="none"/><text x="60" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111110" text-anchor="start">Kiosk placement: on the dominant path, between the entrance and the counter</text><text x="60" y="70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">The placement standard from the implementation playbook, drawn as a floor plan. Kiosks sit where every guest walks, the foyer host stands where the path splits, and the counter stays an equal choice.</text><rect x="60" y="100" width="760" height="460" rx="4" fill="#fafaf7" stroke="#111110"/><rect x="60" y="280" width="70" height="100" rx="2" fill="#fff" stroke="#111110"/><text x="95" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">Entrance</text><rect x="630" y="140" width="190" height="380" rx="2" fill="#f4f3ee" stroke="#111110"/><text x="725" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="middle">Counter</text><text x="725" y="356" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="middle">cash, specific pieces,</text><text x="725" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="middle">stealth register</text><rect x="630" y="520" width="190" height="40" rx="2" fill="#eeede7" stroke="#111110"/><text x="725" y="544" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">Collection point</text><path d="M130,330 L630,330" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="10 8" fill="none"/><text x="360" y="315" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="start">dominant path</text><rect x="310" y="220" width="44" height="62" rx="4" fill="#fff" stroke="#111110"/><rect x="318" y="228" width="28" height="36" rx="2" fill="#111110" stroke="none"/><text x="332" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#111110" text-anchor="middle">Kiosk 1</text><rect x="390" y="220" width="44" height="62" rx="4" fill="#fff" stroke="#111110"/><rect x="398" y="228" width="28" height="36" rx="2" fill="#111110" stroke="none"/><text x="412" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#111110" text-anchor="middle">Kiosk 2</text><rect x="470" y="220" width="44" height="62" rx="4" fill="#fff" stroke="#111110"/><rect x="478" y="228" width="28" height="36" rx="2" fill="#111110" stroke="none"/><text x="492" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#111110" text-anchor="middle">Kiosk 3</text><text x="310" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="start">Kiosks in a bank, facing the path, three or more</text><circle cx="230" cy="400" r="14" fill="#1d4ed8"/><text x="230" y="440" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Foyer host</text><text x="230" y="456" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="middle">where the path splits</text><rect x="580" y="430" width="160" height="70" rx="6" fill="#fff" stroke="#bdbdb7" stroke-dasharray="4 3"/><text x="660" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6e6e69" text-anchor="middle">Queue space</text><text x="660" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6e6e69" text-anchor="middle">for the counter path</text><rect x="310" y="480" width="180" height="50" rx="6" fill="#fff" stroke="#bdbdb7" stroke-dasharray="4 3"/><text x="400" y="502" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6e6e69" text-anchor="middle">Dining</text><text x="400" y="518" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6e6e69" text-anchor="middle">no kiosks past the counter</text><text x="850" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Placement rules</text><text x="850" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• Kiosks on the dominant path between</text><text x="850" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">entrance and counter, never behind the</text><text x="850" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">guest or past the counter.</text><text x="850" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• A bank of three or more where the</text><text x="850" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">format allows; spacing that lets two</text><text x="850" y="228" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">guests order side by side with a host</text><text x="850" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">between.</text><text x="850" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• The counter visible from every kiosk,</text><text x="850" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">so choosing it never feels like giving</text><text x="850" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">up.</text><text x="850" y="320" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• Cash and specific-piece requests have</text><text x="850" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">a counter path with the stealth</text><text x="850" y="352" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">register; nobody is turned away.</text><text x="850" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• Collection point separate from the</text><text x="850" y="390" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">counter queue, with the collection</text><text x="850" y="406" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">screen in the guest's line of sight.</text><text x="850" y="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• Kiosk count from the playbook formula:</text><text x="850" y="444" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">peak front-counter transactions and</text><text x="850" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">target kiosk share, not floor area.</text><text x="850" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">• New builds submit a floor plan or</text><text x="850" y="498" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">photos for approval; the whole team is</text><text x="850" y="514" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">trained before go-live.</text><text x="60" y="602" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Concept floor plan drawn September 2026 from the placement standard; not a specific restaurant.</text></svg>