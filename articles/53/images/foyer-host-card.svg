<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="Foyer host training card, front and back"><rect x="0" y="0" width="1200" height="860" rx="0" fill="#fff" stroke="none"/><text x="60" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">The foyer host card</text><text x="60" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a46" text-anchor="start">The one-page training card for the floor role, as a crew member would carry it. Front: the role. Back: what to do when it goes wrong.</text><rect x="60" y="100" width="530" height="700" rx="14" fill="#fff" stroke="#111110"/><rect x="60" y="100" width="530" height="54" rx="14" fill="#111110" stroke="none"/><rect x="60" y="130" width="530" height="24" fill="#111110"/><text x="80" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">FOYER HOST</text><text x="570" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#d8d8d3" text-anchor="end">Peak hours · rostered role</text><text x="80" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Your job in one line</text><text x="80" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Stand between the door and the machine. Greet,</text><text x="80" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">assist, direct, and drive adoption. Nobody enters</text><text x="80" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">ungreeted.</text><text x="80" y="265" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">The greeting</text><rect x="80" y="273" width="490" height="58" rx="8" fill="#f4f3ee" stroke="none"/><text x="92" y="297" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">"Hi, I'm [name], your ordering host.</text><text x="92" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Would you like faster, cashless ordering at the kiosk?"</text><text x="80" y="357" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Before peak, check</text><rect x="82" y="371" width="14" height="14" rx="3" fill="#fff" stroke="#111110"/><text x="104" y="382" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Menu availability synced</text><rect x="82" y="393" width="14" height="14" rx="3" fill="#fff" stroke="#111110"/><text x="104" y="404" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Collection screen working</text><rect x="82" y="415" width="14" height="14" rx="3" fill="#fff" stroke="#111110"/><text x="104" y="426" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Kiosks cleaned</text><rect x="82" y="437" width="14" height="14" rx="3" fill="#fff" stroke="#111110"/><text x="104" y="448" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Receipt and payment stock ready</text><text x="80" y="463" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Primary duties</text><text x="80" y="481" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Greet. Assist without judging. Direct cash and</text><text x="80" y="497" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">specific-piece requests to the counter. Drive</text><text x="80" y="513" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">adoption.</text><text x="80" y="537" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Secondary duties</text><text x="80" y="555" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Foyer cleanliness. High-touch surfaces cleaned every</text><text x="80" y="571" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">hour.</text><text x="80" y="595" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Two rules</text><text x="80" y="613" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">Never make a guest feel wrong for choosing the</text><text x="80" y="629" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">counter. Never leave a guest alone at a failed</text><text x="80" y="645" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111110" text-anchor="start">kiosk.</text><text x="80" y="782" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e69" text-anchor="start">Reports to the restaurant manager · reviewed monthly</text><rect x="610" y="100" width="530" height="700" rx="14" fill="#fff" stroke="#111110"/><rect x="610" y="100" width="530" height="54" rx="14" fill="#f4f3ee" stroke="none"/><rect x="610" y="130" width="530" height="24" fill="#f4f3ee"/><text x="630" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#111110" text-anchor="start">WHEN IT GOES WRONG</text><text x="1120" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e69" text-anchor="end">First-line recovery</text><text x="630" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Guest has cash</text><text x="630" y="201" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Walk them to the counter queue with a smile. The counter is</text><text x="630" y="216" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">an equal path, not a fallback.</text><text x="630" y="243" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Item out of stock on the kiosk</text><text x="630" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Use the out-of-stock line and offer the counter. Do not let</text><text x="630" y="275" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">them retry.</text><text x="630" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Kiosk fails</text><text x="630" y="319" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Retry once. Check the error-code catalogue. Call the manager</text><text x="630" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">for a reboot. Reprint from the stand-alone printer. The</text><text x="630" y="349" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">guest stays with you.</text><text x="630" y="376" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Payment times out</text><text x="630" y="393" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Tell the guest what happened before they ask. Re-take on the</text><text x="630" y="408" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">pin pad or move to the counter.</text><text x="630" y="435" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Order not flipped to ready</text><text x="630" y="452" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Flip it. Then tell the guest and the kitchen. The order-to-</text><text x="630" y="467" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">collect rule is yours to keep.</text><text x="630" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111110" text-anchor="start">Guest struggling and about to give up</text><text x="630" y="511" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">Step in early. Help them navigate, never take over unasked,</text><text x="630" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a4a46" text-anchor="start">never judge.</text><rect x="630" y="712" width="490" height="58" rx="8" fill="#f4f3ee" stroke="none"/><text x="642" y="734" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e69" text-anchor="start">Scan for the scenario videos</text><text x="642" y="754" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111110" text-anchor="start">Short good-and-bad examples for each situation above.</text><rect x="1056" y="720" width="44" height="44" rx="4" fill="#fff" stroke="#111110"/><text x="60" y="838" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Concept rendering drawn September 2026 from the floor-role standard (QSR-FHR-001) and the training approach; four franchisee groups had each invented a version of this role, and the standard converged them.</text></svg>