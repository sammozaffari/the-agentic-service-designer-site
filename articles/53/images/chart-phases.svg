<svg xmlns="http://www.w3.org/2000/svg" width="960" height="426" viewBox="0 0 960 426" role="img" aria-label="Twenty-eight weeks, in seven phases"><rect width="960" height="426" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Twenty-eight weeks, in seven phases</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Three gates held the sequence: no concept before the insights held, no standard before pilot evidence, no enforcement before the</text><text x="28.0" y="86.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">compliance mechanism existed.</text><line x1="74" y1="312.0" x2="932" y2="312.0" stroke="#d8d7d1" stroke-width="1"/><text x="66.0" y="316.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">0w</text><line x1="74" y1="259.5" x2="932" y2="259.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="263.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">2.5w</text><line x1="74" y1="207.0" x2="932" y2="207.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="211.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">5w</text><line x1="74" y1="154.5" x2="932" y2="154.5" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="158.5" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">7.5w</text><line x1="74" y1="102.0" x2="932" y2="102.0" stroke="#e8e7e1" stroke-width="1"/><text x="66.0" y="106.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">10w</text><rect x="120.3" y="144.0" width="28.0" height="168.0" fill="#23231f"/><text x="134.3" y="138.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#111110" text-anchor="middle">8</text><rect x="242.9" y="249.0" width="28.0" height="63.0" fill="#cfcec7"/><text x="256.9" y="243.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">3</text><rect x="365.4" y="249.0" width="28.0" height="63.0" fill="#cfcec7"/><text x="379.4" y="243.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">3</text><rect x="488.0" y="228.0" width="28.0" height="84.0" fill="#cfcec7"/><text x="502.0" y="222.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">4</text><rect x="610.6" y="228.0" width="28.0" height="84.0" fill="#cfcec7"/><text x="624.6" y="222.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">4</text><rect x="733.1" y="249.0" width="28.0" height="63.0" fill="#cfcec7"/><text x="747.1" y="243.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">3</text><rect x="855.7" y="249.0" width="28.0" height="63.0" fill="#cfcec7"/><text x="869.7" y="243.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="middle">3</text><text x="135.3" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Research and</text><text x="135.3" y="343.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">evidence</text><text x="257.9" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Synthesis</text><text x="380.4" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Journey mapping</text><text x="503.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Concept and</text><text x="503.0" y="343.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">standard</text><text x="625.6" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Training and</text><text x="625.6" y="343.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">playbook</text><text x="748.1" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Standards and</text><text x="748.1" y="343.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">governance</text><text x="870.7" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69" text-anchor="middle">Measurement</text><text x="28.0" y="374.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Eight of the twenty-eight weeks went to evidence before anything was drawn.</text><text x="28.0" y="393.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline and gates, section 7 of this case study.</text></svg>