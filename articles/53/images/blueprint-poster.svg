<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="627" viewBox="0 0 1600 627" role="img" aria-label="Self-service ordering: the kiosk journey with a foyer host"><rect width="1600" height="627" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">Self-service ordering: the kiosk journey with a foyer host</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Five stages from the door to the hand-off, with the foyer host as its own frontstage lane. The measures lane says what counts as done; the failure</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">points are where the channel broke before the role existed.</text><rect x="190.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 Enter and greet</text><rect x="468.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Order</text><rect x="746.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Pay</text><rect x="1024.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Prepare</text><rect x="1302.0" y="110" width="278.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Collect and enjoy</text><rect x="20" y="110" width="170" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="170" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Guest (frontstage)</text><rect x="190.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="200.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Greeted within seconds</text><text x="200.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Before the redesign nobody owned the space</text><text x="200.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">between the door and the machine.</text><rect x="468.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="478.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Guided first order</text><text x="478.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Help to navigate, never judge, and the</text><text x="478.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">counter offered as an equal path.</text><rect x="746.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="756.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Card at the kiosk</text><text x="756.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Kiosks take no cash by design; cash guests</text><text x="756.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">go to the counter queue.</text><rect x="1024.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1034.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Waits at the pick-up queue</text><text x="1034.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The collection screen shows order status;</text><text x="1034.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">delays are acknowledged.</text><rect x="1302.0" y="150" width="278.0" height="83" fill="#ffffff" stroke="#bdbdb7"/><text x="1312.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order verified at hand-off</text><text x="1312.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The presenter confirms the order; the</text><text x="1312.0" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">feedback link is on the receipt.</text><rect x="20" y="233" width="170" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Foyer host</text><text x="30" y="271" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">(frontstage)</text><rect x="190.0" y="233" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="200.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Greeting and the cash-or-card ask</text><text x="200.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">No guest enters ungreeted; cash and</text><text x="200.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">specific-piece requests are sent to the</text><text x="200.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">counter.</text><rect x="468.0" y="233" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="478.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Assists; runs the pre-peak checks</text><text x="478.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Menu synced, collection screen working,</text><text x="478.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">kiosks cleaned, receipt and payment stock</text><text x="478.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">ready.</text><rect x="746.0" y="233" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="756.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Cash path to the counter</text><text x="756.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Cash guests are never abandoned at the</text><text x="756.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">machine.</text><rect x="1024.0" y="233" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1034.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Ready flip within the order-to-collect</text><text x="1034.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">rule</text><text x="1034.0" y="287" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The order is flipped to ready inside the</text><text x="1034.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">standard.</text><rect x="1302.0" y="233" width="278.0" height="100" fill="#fbfaf6" stroke="#bdbdb7"/><text x="1312.0" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Hand-off and parting recognition</text><text x="1312.0" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The guest leaves recognised, not ignored:</text><text x="1312.0" y="285" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">the moment that drives the feedback theme.</text><line x1="20" y1="333" x2="1580" y2="333" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1576" y="329" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="333" width="170" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="355" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Restaurant</text><text x="30" y="371" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">(backstage)</text><rect x="190.0" y="333" width="278.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="200.0" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Rostering and cleanliness</text><text x="200.0" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The foyer host is a rostered role the time</text><text x="200.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">and attendance platform now supports;</text><text x="200.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">hourly high-touch cleaning.</text><rect x="468.0" y="333" width="278.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="478.0" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order to the till system; menu sync</text><text x="478.0" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Availability refreshed nightly; express-</text><text x="478.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">kiosk exclusions and mismatches scripted.</text><rect x="746.0" y="333" width="278.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="756.0" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Payment state verified</text><text x="756.0" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Pin-pad timeouts and failed payments have</text><text x="756.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">defined responses.</text><rect x="1024.0" y="333" width="278.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1034.0" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kitchen display and packer</text><text x="1034.0" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">One packer or presenter per redeployed</text><text x="1034.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">cashier.</text><rect x="1302.0" y="333" width="278.0" height="98" fill="#f4f3ee" stroke="#bdbdb7"/><text x="1312.0" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Collect and recover</text><text x="1312.0" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">First-line ladder: retry, error-code</text><text x="1312.0" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">catalogue, manager reboot, stand-alone</text><text x="1312.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">reprint.</text><rect x="20" y="431" width="170" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="30" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Measures</text><rect x="190.0" y="431" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="200.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Greet rate; cash routed</text><text x="200.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Every guest greeted at peak; cash guests</text><text x="200.0" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">routed, not turned away.</text><rect x="468.0" y="431" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="478.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Assisted first order completes</text><text x="478.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Guided first order inside the standard</text><text x="478.0" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">time.</text><rect x="746.0" y="431" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="756.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter wait inside the golden rule</text><text x="756.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Guest through the system inside the</text><text x="756.0" y="483" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">standard.</text><rect x="1024.0" y="431" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="1034.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order-to-collect inside the rule</text><text x="1034.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Ready flip measured per order.</text><rect x="1302.0" y="431" width="278.0" height="83" fill="#eeede7" stroke="#bdbdb7"/><text x="1312.0" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Feedback theme mix</text><text x="1312.0" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Staff recognition the top positive theme.</text><rect x="20" y="514" width="170" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure points</text><rect x="190.0" y="514" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="200.0" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 No one owns the door</text><text x="200.0" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Nobody greets; first-timers abandon.</text><rect x="468.0" y="514" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="478.0" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 No channel training</text><text x="478.0" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order-taking courses had no self-service</text><text x="478.0" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">content.</text><rect x="746.0" y="514" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="756.0" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Cash guests excluded</text><text x="756.0" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Long counter waits; guests turned away from</text><text x="756.0" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">the channel.</text><rect x="1024.0" y="514" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1034.0" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 Failed kiosk ends the visit</text><text x="1034.0" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Help-desk dependent; no first-line</text><text x="1034.0" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">recovery.</text><rect x="1302.0" y="514" width="278.0" height="83" fill="#fdf3f2" stroke="#bdbdb7"/><text x="1312.0" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 Foyer cleanliness unowned</text><text x="1312.0" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The most negative feedback cluster.</text><text x="20" y="617" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific, 2023 to 2024. Drawn by Sam Mozaffari from the engagement's order workflow; vendors, sites and people removed. Rendered September 2026.</text></svg>