<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-label="The time standards written into the role"><rect width="960" height="252" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">The time standards written into the role</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Three of the foyer host's measures are clock measures, and two of them are deliberately the same number.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Counter wait, the five-minute golden rule</text><rect x="328" y="90" width="167.4" height="16" rx="2" fill="#4a6b4f"/><text x="503.4" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">300s</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Guided first order completes</text><rect x="328" y="120" width="33.5" height="16" rx="2" fill="#4a6b4f"/><text x="369.5" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">60s</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Order to collect, the ready flip</text><rect x="328" y="150" width="33.5" height="16" rx="2" fill="#4a6b4f"/><text x="369.5" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">60s</text><text x="28.0" y="200.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The counter path is allowed five times the time of the kiosk path, which is what makes it an equal path rather than a penalty.</text><text x="28.0" y="219.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">The measures lane of the kiosk order workflow, section 5 of this case study.</text></svg>