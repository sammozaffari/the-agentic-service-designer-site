<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Safety reporting concept, composition</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1440px;height:900px;overflow:hidden}
  body{background:#f4f3ee;font:400 14px Inter,Helvetica,Arial,sans-serif;position:relative}
  .win{position:absolute;left:56px;top:78px;width:900px;border-radius:12px;overflow:hidden;background:#fff;
       border:1px solid #cfcfc9;box-shadow:0 2px 4px rgba(17,17,16,.06),0 30px 60px -28px rgba(17,17,16,.5)}
  .bar{height:30px;background:#eceae4;border-bottom:1px solid #dcdad4;display:flex;align-items:center;gap:7px;padding:0 12px}
  .bar i{width:9px;height:9px;border-radius:50%;background:#cfcfc9;display:block}
  .bar span{margin-left:10px;height:16px;flex:1;max-width:320px;border-radius:8px;background:#f8f8f5;border:1px solid #dcdad4}
  .win img{display:block;width:100%;height:auto}
  .phone{position:absolute;right:74px;bottom:96px;width:262px;border-radius:26px;overflow:hidden;background:#fff;
         border:1px solid #cfcfc9;box-shadow:0 2px 4px rgba(17,17,16,.06),0 26px 52px -22px rgba(17,17,16,.55)}
  .phone img{display:block;width:100%;height:auto}
</style></head><body>
  <div class="win"><div class="bar"><i></i><i></i><i></i><span></span></div>
    <img src="../img/dashboard-manager.png" alt=""></div>
  <div class="phone"><img src="../img/quick-add-entry.png" alt=""></div>
</body></html>
