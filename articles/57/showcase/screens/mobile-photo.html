<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a photo · Safety reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../assets/product/tokens.css"><link rel="stylesheet" href="../../../../assets/product/components.css">
<style>
html,body{background:var(--p-neutral-bg)}
body{width:393px;min-height:852px}
.p-phone{width:393px;height:852px;border:0;border-radius:0;box-shadow:none;background:#0b0b0c}
.p-phone .p-status{color:#fff}
.bar{display:flex;align-items:center;gap:12px;padding:2px 16px 12px;color:#fff}
.bar .x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.bar b{font-size:var(--p-fs-4);font-weight:600;letter-spacing:var(--p-tracking-tight)}
.bar .step{margin-left:auto;font-family:var(--p-font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.62)}

.view{position:relative;flex:1;margin:0 16px;border-radius:var(--p-r-3);overflow:hidden;
      background:linear-gradient(168deg,#2a2b2f,#15161a 62%,#0e0f12)}
/* a suggestion of the fryer line, so the frame reads as a viewfinder rather than a grey box */
.view .hint{position:absolute;inset:0;opacity:.32;background:
  linear-gradient(90deg,transparent 46%,rgba(255,255,255,.5) 46.4%,transparent 47%),
  linear-gradient(0deg,transparent 62%,rgba(255,255,255,.28) 62.5%,transparent 63.5%),
  radial-gradient(120px 80px at 30% 70%,rgba(255,255,255,.14),transparent 70%)}
.view .crop{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.8)}
.view .c1{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.view .c2{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.view .c3{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.view .c4{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 6px 0}

/* the instruction sits on the frame, where the person is already looking */
.tip{position:absolute;left:14px;right:14px;top:14px;background:var(--p-panel);border-radius:var(--p-r-2);
     padding:11px 13px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.tip .g{width:26px;height:26px;border-radius:8px;background:var(--p-warning-bg);color:var(--p-warning);display:grid;place-items:center;flex:none}
.tip b{display:block;font-size:var(--p-fs-3);font-weight:600;line-height:1.3}
.tip span{display:block;font-size:var(--p-fs-2);color:var(--p-ink-3);margin-top:2px;line-height:1.4}

.skipbar{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;display:inline-flex;align-items:center;gap:8px;
         white-space:nowrap;background:rgba(11,11,12,.78);border:1px solid rgba(255,255,255,.18);border-radius:var(--p-r-pill);
         padding:7px 15px;color:rgba(255,255,255,.9);font-size:var(--p-fs-2)}

.shutterbar{padding:20px 16px 26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#fff}
.shutterbar .side{font-size:var(--p-fs-2);color:rgba(255,255,255,.7)}
.shutterbar .side.r{text-align:right}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.34);
         box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.p-phone .p-home{background:#fff;opacity:.55;margin:0 auto}
</style>
</head>
<body class="p-app">
<div class="p-phone">
  <div class="p-status"><span>9:41</span><span style="font-weight:500;color:rgba(255,255,255,.62)">Riverside · 0412</span></div>
  <div class="bar">
    <span class="x"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
    <b>Add a photo</b>
    <span class="step">Step 4 of 4</span>
  </div>

  <div class="view">
    <div class="hint"></div>
    <span class="crop c1"></span><span class="crop c2"></span><span class="crop c3"></span><span class="crop c4"></span>
    <div class="tip">
      <span class="g"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="7"/><path d="M9 5.5v4M9 12.5h.01"/></svg></span>
      <div><b>Show the thing, not the injury</b><span>A photo of the fryer or the floor helps whoever fixes it. Never photograph a person.</span></div>
    </div>
    <div class="skipbar">
      <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l4 4 8-8"/></svg>
      A photo is optional
    </div>
  </div>

  <div class="shutterbar">
    <span class="side">Upload</span>
    <button class="shutter" aria-label="Take a photo"></button>
    <span class="side r">Skip</span>
  </div>
  <div class="p-home"></div>
</div>
</body></html>
