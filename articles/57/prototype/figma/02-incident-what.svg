<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="02-incident-what"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Step 1 of 4</text><text x="20" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Report an incident</text><text x="20" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">What happened? Pick the closest. The manager classifies severity later.</text><g id="Choice/Burn"><rect x="20" y="150" width="171" height="40" rx="8" fill="#111110" stroke="#111110" stroke-width="1"/><text x="32" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#fff" text-anchor="start">Burn</text></g><g id="Choice/Cut"><rect x="199" y="150" width="171" height="40" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="211" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">Cut</text></g><g id="Choice/Slip, trip or fall"><rect x="20" y="198" width="171" height="40" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">Slip, trip or fall</text></g><g id="Choice/Hit by or against"><rect x="199" y="198" width="171" height="40" rx="8"