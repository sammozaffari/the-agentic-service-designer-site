<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="04-incident-submitted"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Done</text><text x="20" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Report submitted</text><g id="Card/Success"><rect x="20" y="130" width="350" height="190" rx="12" fill="#eaf4ec" stroke="#bfe0c7"/><text x="36" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f6b3a" text-anchor="start">Your manager has been notified</text><text x="36" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">and will check on you shortly.</text><text x="36" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">What happens next</text><text x="36" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">•  Welfare check with your manager</text><text x="36" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">•  Manager classifies severity from what happened</text><text x="36" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">•  Regulatory questions answered at the review</text><text x="36" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">•  You are told what changed</text></g><g id="Card/Summary"><rect x="20" y="336" width="350" height="150" rx="10" fill="#f4f3ee"/><text x="36" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">What happened</text><text x="146" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Burn</text><text x="36" y="382" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">How</text><text x="146" y="382" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Oil splash while filtering</text><text x="36" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">Body part</text><text x="146" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Hand or fingers</text><text x="36" y="422" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">Equipment</text><text x="146" y="422" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Fryer 2</text><text x="36" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">When</text><text x="146" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">10:45</text><text x="36" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">Where</text><text x="146" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Kitchen</text></g><g id="Button/Start a new report"><rect x="20" y="754" width="350" height="44" rx="8" fill="#111110" stroke="#111110" stroke-width="1"/><text x="195.0" y="782" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Start a new report</text></g></g></svg>