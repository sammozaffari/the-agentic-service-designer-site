<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="05-manager-review"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Manager review</text><text x="20" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Incident assessment</text><text x="20" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">After the welfare check. Severity from what happened.</text><g id="Card/Report"><rect x="20" y="144" width="350" height="126" rx="10" fill="#f4f3ee"/><text x="36" y="166" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e69" text-anchor="start">TEAM MEMBER'S REPORT</text><text x="36" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">What happened</text><text x="146" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Burn</text><text x="36" y="210" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">How</text><text x="146" y="210" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Oil splash while filtering</text><text x="36" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">Body part</text><text x="146" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">Hand or fingers</text><text x="36" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">When / where</text><text x="146" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111110" text-anchor="start">10:45, Kitchen</text></g><text x="20" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Welfare check</text><g id="Checkbox/First aid provided"><rect x="20" y="312" width="18" height="18" rx="4" fill="#fff" stroke="#111110" stroke-width="1"/><text x="48" y="326" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">First aid provided</text></g><g id="Checkbox/Fit to continue work"><rect x="20" y="346" width="18" height="18" rx="4" fill="#fff" stroke="#111110" stroke-width="1"/><text x="48" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">Fit to continue work</text></g><g id="Checkbox/Sent for medical treatment"><rect x="20" y="380" width="18" height="18" rx="4" fill="#fff" stroke="#111110" stroke-width="1"/><text x="48" y="394" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">Sent for medical treatment</text></g><g id="Checkbox/Sent home to rest"><rect x="20" y="414" width="18" height="18" rx="4" fill="#fff" stroke="#111110" stroke-width="1"/><text x="48" y="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#111110" text-anchor="start">Sent home to rest</text></g><g id="Field/Outcome classification"><text x="20" y="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Outcome classification</text><text x="20" y="488" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Based on the treatment actually required</text><rect x="20" y="500" width="350" height="42" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111110" text-anchor="start">First aid only, treated on site</text></g><g id="Field/Preliminary root cause"><text x="20" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Preliminary root cause</text><rect x="20" y="574" width="350" height="42" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6e6e69" text-anchor="start">Select…</text></g><g id="Button/Submit assessment"><rect x="20" y="754" width="350" height="44" rx="8" fill="#111110" stroke="#111110" stroke-width="1"/><text x="195.0" y="782" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Submit assessment</text></g></g></svg>