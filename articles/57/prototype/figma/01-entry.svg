<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="01-entry"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">What would you like to report?</text><text x="20" y="114" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="start">One starting point. No need to know the terminology.</text><g id="Choice/Something happened"><rect x="20" y="140" width="350" height="52" rx="8" fill="#111110" stroke="#111110" stroke-width="1"/><text x="32" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start">Something happened</text><text x="32" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#d8d8d3" text-anchor="start">An injury, a near miss or an event that occurred</text></g><g id="Choice/I spotted a hazard"><rect x="20" y="204" width="350" height="52" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="228" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">I spotted a hazard</text><text x="32" y="246" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">A condition that could cause harm</text></g><text x="20" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Not sure? "I burned my hand on the fryer" is an incident.</text><text x="20" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">"The floor is wet" is a hazard.</text><g id="Button/Continue"><rect x="20" y="754" width="350" height="44" rx="8" fill="#111110" stroke="#111110" stroke-width="1"/><text x="195.0" y="782" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Continue</text></g></g></svg>