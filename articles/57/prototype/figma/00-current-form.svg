<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="00-current-form"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Current form, generalised</text><text x="20" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Report an incident</text><g id="Field/Incident type"><text x="20" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Incident type</text><text x="20" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Required</text><rect x="20" y="170" width="350" height="42" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6e6e69" text-anchor="start">Injury: medical treatment, lost time…</text></g><text x="20" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b3261e" text-anchor="start">Asks the reporter to predict the outcome.</text><g id="Field/Is this notifiable to the regulator?"><text x="20" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Is this notifiable to the regulator?</text><text x="20" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5"