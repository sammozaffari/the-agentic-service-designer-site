<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="03-incident-error"><rect width="390" height="844" fill="#fff"/><rect x="0" y="0" width="390" height="44" fill="#f4f3ee"/><text x="16" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111110" text-anchor="start">9:41</text><text x="374" y="28" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e69" text-anchor="end">KFC safety reporting</text><text x="20" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Step 4 of 4</text><text x="20" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Report an incident</text><g id="Alert/Error"><rect x="20" y="124" width="350" height="46" rx="8" fill="#fbeae8"/><rect x="20" y="124" width="4" height="46" fill="#b3261e"/><text x="34" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a1a14" text-anchor="start">Two required fields are missing: when and where.</text></g><g id="Field/When did this happen?"><text x="20" y="200" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">When did this happen?</text><text x="20" y="218" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Required</text><rect x="20" y="230" width="350" height="42" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1"/><text x="32" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6e6e69" text-anchor="start">Select…</text><text x="20" y="288" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b3261e" text-anchor="start">Enter the time, roughly is fine.</text></g><g id="Field/Where did this happen?"><text x="20" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Where did this happen?</text><text x="20" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Required</text><rect x="20" y="340" width="350" height="42" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1"/><text x="32" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6e6e69" text-anchor="start">Select…</text><text x="20" y="398" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b3261e" text-anchor="start">Choose where it happened.</text></g><g id="Field/Anything else to add?"><text x="20" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111110" text-anchor="start">Anything else to add?</text><text x="20" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">Optional</text><rect x="20" y="450" width="350" height="42" rx="8" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="32" y="476" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6e6e69" text-anchor="start"></text></g><rect x="20" y="500" width="350" height="60" rx="8" fill="#f4f3ee" stroke="#bdbdb7" stroke-width="1"/><text x="195" y="535" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e69" text-anchor="middle">Tap to take or upload a photo</text><g id="Button/Back"><rect x="20" y="754" width="170" height="44" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="105.0" y="782" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111110" text-anchor="middle">Back</text></g><g id="Button/Submit report"><rect x="200" y="754" width="17