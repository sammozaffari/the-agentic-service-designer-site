<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="How the research tool works"><rect width="1100" height="610" fill="#fff"/><text x="24" y="46" font-family="Inter,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#111110">How the research tool works</text><text x="24" y="69" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6e6e69">A transcript goes in one end and a placed, reviewed record comes out the other. Every machine step has a human step after it, and</text><text x="24" y="86" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6e6e69">every import can be rolled back to the checkpoint it started from.</text><text x="24" y="125" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111110">Capture</text><text x="24" y="141" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">Interviews, survey,</text><text x="24" y="154" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">visits</text><rect x="180.0" y="106" width="210.5" height="78" rx="7" fill="#ffffff" stroke="#bdbdb7"/><text x="191.0" y="127" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Interview recording</text><text x="191.0" y="146" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">13 interviews, mostly in restaurants</text><rect x="408.5" y="106" width="210.5" height="78" rx="7" fill="#eef2fb" stroke="#9fb0d4"/><text x="419.5" y="127" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Transcription</text><text x="419.5" y="146" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Speech to text, speaker separated</text><rect x="637.0" y="106" width="210.5" height="78" rx="7" fill="#ffffff" stroke="#bdbdb7"/><text x="648.0" y="127" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Survey and field notes</text><text x="648.0" y="146" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">55 responses, 8 restaurant visits, 2</text><text x="648.0" y="159" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">form walkthroughs</text><rect x="865.5" y="106" width="210.5" height="78" rx="7" fill="#f4f3ee" stroke="#bdbdb7"/><text x="876.5" y="127" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Source of record</text><text x="876.5" y="146" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Every record keeps a link back to the</text><text x="876.5" y="159" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">transcript line it came from</text><text x="24" y="229" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111110">Extract</text><text x="24" y="245" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">Claude Code command</text><rect x="180.0" y="210" width="210.5" height="91" rx="7" fill="#eef2fb" stroke="#9fb0d4"/><text x="191.0" y="231" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">/synthesise</text><text x="191.0" y="250" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Reads the transcript and emits</text><text x="191.0" y="263" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">candidate insights as JSON</text><rect x="408.5" y="210" width="210.5" height="91" rx="7" fill="#eef2fb" stroke="#9fb0d4"/><text x="419.5" y="231" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Schema validation</text><text x="419.5" y="250" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Type, stakeholder, stage, substage and</text><text x="419.5" y="263" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">theme must all resolve or the batch is</text><text x="419.5" y="276" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">refused</text><rect x="637.0" y="210" width="210.5" height="91" rx="7" fill="#eef2fb" stroke="#9fb0d4"/><text x="648.0" y="231" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Git checkpoint</text><text x="648.0" y="250" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Tag pre-import-{batch}, so a bad batch</text><text x="648.0" y="263" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">is one command to undo</text><rect x="865.5" y="210" width="210.5" height="91" rx="7" fill="#fdf6e3" stroke="#ddc48a"/><text x="876.5" y="231" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Review, record by record</text><text x="876.5" y="250" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Read against the transcript, corrected</text><text x="876.5" y="263" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">where the extraction flattened what</text><text x="876.5" y="276" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">someone meant</text><text x="24" y="346" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111110">Place</text><text x="24" y="362" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">Blueprint and</text><text x="24" y="375" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">evidence</text><rect x="180.0" y="327" width="210.5" height="78" rx="7" fill="#f4f3ee" stroke="#bdbdb7"/><text x="191.0" y="348" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Typed record</text><text x="191.0" y="367" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Pain point, action, decision,</text><text x="191.0" y="380" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">behaviour, process gap or opportunity</text><rect x="408.5" y="327" width="210.5" height="78" rx="7" fill="#fdf6e3" stroke="#ddc48a"/><text x="419.5" y="348" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Placed on the blueprint</text><text x="419.5" y="367" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Tied to one of 5 stages, 11 substages</text><text x="419.5" y="380" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">and the role it concerns</text><rect x="637.0" y="327" width="210.5" height="78" rx="7" fill="#f4f3ee" stroke="#bdbdb7"/><text x="648.0" y="348" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">184 blueprint items</text><text x="648.0" y="367" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">The service as a role by stage grid,</text><text x="648.0" y="380" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">in SQLite</text><rect x="865.5" y="327" width="210.5" height="78" rx="7" fill="#f4f3ee" stroke="#bdbdb7"/><text x="876.5" y="348" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Evidence trail</text><text x="876.5" y="367" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Finding, to substage, to decision, to</text><text x="876.5" y="380" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">proposal</text><text x="24" y="450" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111110">Use</text><text x="24" y="466" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">What comes out</text><rect x="180.0" y="431" width="210.5" height="91" rx="7" fill="#eaf3ec" stroke="#9fc3a6"/><text x="191.0" y="452" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Findings report</text><text x="191.0" y="471" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Generated from the records rather than</text><text x="191.0" y="484" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">retyped from a board</text><rect x="408.5" y="431" width="210.5" height="91" rx="7" fill="#eaf3ec" stroke="#9fc3a6"/><text x="419.5" y="452" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Miro board</text><text x="419.5" y="471" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Frames per stage, colour coded</text><text x="419.5" y="484" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">stickies per role, pushed by the</text><text x="419.5" y="497" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">migrator</text><rect x="637.0" y="431" width="210.5" height="91" rx="7" fill="#eef2fb" stroke="#9fb0d4"/><text x="648.0" y="452" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Drafted recommendations</text><text x="648.0" y="471" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Anthropic SDK, five templates; the</text><text x="648.0" y="484" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">prompt is stored with its output</text><rect x="865.5" y="431" width="210.5" height="91" rx="7" fill="#fdf6e3" stroke="#ddc48a"/><text x="876.5" y="452" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#111110">Edited before use</text><text x="876.5" y="471" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Nothing reaches the report or a</text><text x="876.5" y="484" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">stakeholder unedited</text><line x1="390.5" y1="145.0" x2="401.5" y2="145.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M401.5,141.0 L408.5,145.0 L401.5,149.0z" fill="#6e6e69"/><line x1="619.0" y1="145.0" x2="630.0" y2="145.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M630.0,141.0 L637.0,145.0 L630.0,149.0z" fill="#6e6e69"/><line x1="847.5" y1="145.0" x2="858.5" y2="145.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M858.5,141.0 L865.5,145.0 L858.5,149.0z" fill="#6e6e69"/><line x1="390.5" y1="255.5" x2="401.5" y2="255.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M401.5,251.5 L408.5,255.5 L401.5,259.5z" fill="#6e6e69"/><line x1="619.0" y1="255.5" x2="630.0" y2="255.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M630.0,251.5 L637.0,255.5 L630.0,259.5z" fill="#6e6e69"/><line x1="847.5" y1="255.5" x2="858.5" y2="255.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M858.5,251.5 L865.5,255.5 L858.5,259.5z" fill="#6e6e69"/><line x1="390.5" y1="366.0" x2="401.5" y2="366.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M401.5,362.0 L408.5,366.0 L401.5,370.0z" fill="#6e6e69"/><line x1="619.0" y1="366.0" x2="630.0" y2="366.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M630.0,362.0 L637.0,366.0 L630.0,370.0z" fill="#6e6e69"/><line x1="847.5" y1="366.0" x2="858.5" y2="366.0" stroke="#6e6e69" stroke-width="1.3"/><path d="M858.5,362.0 L865.5,366.0 L858.5,370.0z" fill="#6e6e69"/><line x1="390.5" y1="476.5" x2="401.5" y2="476.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M401.5,472.5 L408.5,476.5 L401.5,480.5z" fill="#6e6e69"/><line x1="619.0" y1="476.5" x2="630.0" y2="476.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M630.0,472.5 L637.0,476.5 L630.0,480.5z" fill="#6e6e69"/><line x1="847.5" y1="476.5" x2="858.5" y2="476.5" stroke="#6e6e69" stroke-width="1.3"/><path d="M858.5,472.5 L865.5,476.5 L858.5,480.5z" fill="#6e6e69"/><path d="M970.8,184 C970.8,200 285.2,194 285.2,203" fill="none" stroke="#6e6e69" stroke-width="1.3"/><path d="M281.2,203 L285.2,210 L289.2,203z" fill="#6e6e69"/><text x="293.2" y="200" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#6e6e69">transcripts</text><path d="M970.8,301 C970.8,317 285.2,311 285.2,320" fill="none" stroke="#6e6e69" stroke-width="1.3"/><path d="M281.2,320 L285.2,327 L289.2,320z" fill="#6e6e69"/><text x="293.2" y="317" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#6e6e69">approved batch</text><path d="M970.8,405 C970.8,421 285.2,415 285.2,424" fill="none" stroke="#6e6e69" stroke-width="1.3"/><path d="M281.2,424 L285.2,431 L289.2,424z" fill="#6e6e69"/><text x="293.2" y="421" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#6e6e69">same data</text><rect x="24" y="544" width="11" height="11" rx="2" fill="#eef2fb" stroke="#9fb0d4"/><text x="41" y="553" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Machine step</text><rect x="130.4" y="544" width="11" height="11" rx="2" fill="#fdf6e3" stroke="#ddc48a"/><text x="147.4" y="553" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Human step</text><rect x="224.4" y="544" width="11" height="11" rx="2" fill="#f4f3ee" stroke="#bdbdb7"/><text x="241.4" y="553" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Store</text><rect x="287.4" y="544" width="11" height="11" rx="2" fill="#eaf3ec" stroke="#9fc3a6"/><text x="304.4" y="553" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f3f3b">Output</text><text x="24" y="582" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">Python, Flask and SQLite with a vanilla JavaScript front end; 50 HTTP routes and 2,674 lines in the server; 318 commits between 27 October 2025 and 22</text><text x="24" y="596" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e6e69">January 2026. Counts are from the tool's own database and the December 2025 findings report.</text></svg>