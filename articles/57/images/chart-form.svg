<svg xmlns="http://www.w3.org/2000/svg" width="960" height="453" viewBox="0 0 960 453" role="img" aria-label="What the form asked, and when the reporter could answer it"><rect width="960" height="453" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">What the form asked, and when the reporter could answer it</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Each row is a question the incident form asked. The grey dot is how answerable it was at the moment of reporting; the dark dot is</text><text x="28.0" y="86.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">when the answer actually exists.</text><text x="28.0" y="121.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">What happened, in your words</text><circle cx="742.0" cy="116" r="5.5" fill="#23231f"/><circle cx="742.0" cy="116" r="9" fill="none" stroke="#8a8a83" stroke-width="1.5"/><text x="758.0" y="120.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#6e6e69">answerable now</text><text x="28.0" y="151.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">How it happened</text><circle cx="742.0" cy="146" r="5.5" fill="#23231f"/><circle cx="742.0" cy="146" r="9" fill="none" stroke="#8a8a83" stroke-width="1.5"/><text x="758.0" y="150.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#6e6e69">answerable now</text><text x="28.0" y="181.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Body part and equipment</text><circle cx="742.0" cy="176" r="5.5" fill="#23231f"/><circle cx="742.0" cy="176" r="9" fill="none" stroke="#8a8a83" stroke-width="1.5"/><text x="758.0" y="180.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#6e6e69">answerable now</text><text x="28.0" y="211.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">When and where</text><circle cx="742.0" cy="206" r="5.5" fill="#23231f"/><circle cx="742.0" cy="206" r="9" fill="none" stroke="#8a8a83" stroke-width="1.5"/><text x="758.0" y="210.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#6e6e69">answerable now</text><text x="28.0" y="241.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Severity of the outcome</text><line x1="410.8" y1="236" x2="742.0" y2="236" stroke="#d8d7d1" stroke-width="3"/><circle cx="410.8" cy="236" r="5.5" fill="#8a8a83"/><circle cx="742.0" cy="236" r="5.5" fill="#23231f"/><text x="754.0" y="240.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#3f3f3b">moves to review</text><text x="28.0" y="271.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Incident type classification</text><line x1="410.8" y1="266" x2="742.0" y2="266" stroke="#d8d7d1" stroke-width="3"/><circle cx="410.8" cy="266" r="5.5" fill="#8a8a83"/><circle cx="742.0" cy="266" r="5.5" fill="#23231f"/><text x="754.0" y="270.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#3f3f3b">moves to review</text><text x="28.0" y="301.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Notifiable to the regulator</text><line x1="410.8" y1="296" x2="659.2" y2="296" stroke="#d8d7d1" stroke-width="3"/><circle cx="410.8" cy="296" r="5.5" fill="#8a8a83"/><circle cx="659.2" cy="296" r="5.5" fill="#23231f"/><text x="671.2" y="300.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#3f3f3b">moves to review</text><line x1="328" y1="320.0" x2="742.0" y2="320.0" stroke="#d8d7d1" stroke-width="1"/><text x="328.0" y="335.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">The reporter cannot answer this yet</text><text x="742.0" y="335.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="end">The answer exists</text><rect x="28" y="342" width="10" height="10" rx="2" fill="#8a8a83"/><text x="44.0" y="351.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f3f3b">At the moment of reporting</text><rect x="232.4" y="342" width="10" height="10" rx="2" fill="#23231f"/><text x="248.4" y="351.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f3f3b">After the welfare check</text><text x="28.0" y="384.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The old form asked the bottom three first. The redesign asks the top four first and moves the bottom three to the manager's review, where the</text><text x="28.0" y="401.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">answer exists.</text><text x="28.0" y="420.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Two field-by-field walkthroughs of the platform's forms with the safety team, December 2025.</text></svg>