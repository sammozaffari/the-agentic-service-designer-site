<svg xmlns="http://www.w3.org/2000/svg" width="960" height="377" viewBox="0 0 960 377" role="img" aria-label="Who actually carries the incident journey"><rect width="960" height="377" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Who actually carries the incident journey</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The 184 items on the service blueprint, counted by the role that performs them. The manager carries more of this service than anyone</text><text x="28.0" y="86.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">else, which is why the recommendations went to the manager's routine rather than to the software.</text><text x="28.0" y="121.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Restaurant manager</text><rect x="258" y="108" width="483.6" height="16" rx="2" fill="#3f5a7a"/><text x="749.6" y="121.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">77</text><text x="28.0" y="151.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Team member</text><rect x="258" y="138" width="314.0" height="16" rx="2" fill="#cfcec7"/><text x="580.0" y="151.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">50</text><text x="28.0" y="181.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Systems and platform</text><rect x="258" y="168" width="207.2" height="16" rx="2" fill="#cfcec7"/><text x="473.2" y="181.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">33</text><text x="28.0" y="211.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Area safety lead</text><rect x="258" y="198" width="100.5" height="16" rx="2" fill="#cfcec7"/><text x="366.5" y="211.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">16</text><text x="28.0" y="241.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Franchisee</text><rect x="258" y="228" width="44.0" height="16" rx="2" fill="#cfcec7"/><text x="310.0" y="241.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">7</text><text x="28.0" y="271.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Central safety team</text><rect x="258" y="258" width="6.3" height="16" rx="2" fill="#cfcec7"/><text x="272.3" y="271.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">1</text><text x="28.0" y="308.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The business assumed location explained why reporting varied. The blueprint says the manager touches almost half of the service, and the research</text><text x="28.0" y="325.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">found the same thing in the field.</text><text x="28.0" y="344.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the 184 blueprint items held in the research tool's database.</text></svg>