<svg xmlns="http://www.w3.org/2000/svg" width="960" height="389" viewBox="0 0 960 389" role="img" aria-label="Where the pain points cluster on the journey"><rect width="960" height="389" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Where the pain points cluster on the journey</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The 65 records typed as a pain point, counted by the substage of the incident journey they sit on.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Completing the report</text><rect x="278" y="90" width="115.5" height="16" rx="2" fill="#9b3427"/><text x="401.5" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">19</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Deciding whether to report</text><rect x="278" y="120" width="60.8" height="16" rx="2" fill="#9b3427"/><text x="346.8" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">10</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Immediate response</text><rect x="278" y="150" width="54.7" height="16" rx="2" fill="#cfcec7"/><text x="340.7" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">9</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Awareness of the incident</text><rect x="278" y="180" width="54.7" height="16" rx="2" fill="#cfcec7"/><text x="340.7" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">9</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Follow-up after closing</text><rect x="278" y="210" width="48.6" height="16" rx="2" fill="#cfcec7"/><text x="334.6" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">8</text><text x="28.0" y="253.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Onboarding and induction</text><rect x="278" y="240" width="30.4" height="16" rx="2" fill="#cfcec7"/><text x="316.4" y="253.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5</text><text x="28.0" y="283.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Physical assessment</text><rect x="278" y="270" width="30.4" height="16" rx="2" fill="#cfcec7"/><text x="316.4" y="283.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5</text><text x="28.0" y="320.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The heaviest substage is the one the reporter cannot get right: completing the form. The second is deciding whether a thing is worth reporting at</text><text x="28.0" y="337.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">all. Both are what the redesign changes.</text><text x="28.0" y="356.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Counted from the records typed as pain points in the research tool's database.</text></svg>