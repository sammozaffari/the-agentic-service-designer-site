<svg xmlns="http://www.w3.org/2000/svg" width="960" height="299" viewBox="0 0 960 299" role="img" aria-label="Nine failure points, and where the fix lands"><rect width="960" height="299" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Nine failure points, and where the fix lands</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Most of the leak is in the systems, which is why the reframe moved from the labour market to the admin burden.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Systems and platform</text><rect x="258" y="90" width="251.2" height="16" rx="2" fill="#a8781c"/><text x="517.2" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Manager and process</text><rect x="258" y="120" width="125.6" height="16" rx="2" fill="#cfcec7"/><text x="391.6" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Brand and content</text><rect x="258" y="150" width="125.6" height="16" rx="2" fill="#cfcec7"/><text x="391.6" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Measurement</text><rect x="258" y="180" width="62.8" height="16" rx="2" fill="#cfcec7"/><text x="328.8" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">1</text><text x="28.0" y="230.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Stale listings, a form that asks more than it decides, offers lost to spam and the work-rights step are all platform problems, not market</text><text x="28.0" y="247.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">problems.</text><text x="28.0" y="266.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">The nine failure points on the blueprint in section 5, grouped by where the fix lands.</text></svg>