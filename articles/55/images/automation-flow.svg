<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-label="Automation flow from application to first shift with human lanes"><rect x="0" y="0" width="1500" height="640" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="20" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111110" text-anchor="start">Application to first shift: the automated workflow with its human lanes</text><text x="20" y="56" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e6e69" text-anchor="start">From the hiring workflow specification (HIRE-001). White boxes run automatically; blue boxes are where a person decides. Compliance-locked steps cannot change without sign-off.</text><rect x="20" y="90" width="1460" height="120" rx="6" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="30" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Candidate</text><rect x="20" y="220" width="1460" height="120" rx="6" fill="#f4f3ee" stroke="#bdbdb7" stroke-width="1"/><text x="30" y="242" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Automation</text><rect x="20" y="350" width="1460" height="120" rx="6" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="30" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">Manager</text><rect x="20" y="480" width="1460" height="120" rx="6" fill="#fff" stroke="#bdbdb7" stroke-width="1"/><text x="30" y="502" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110" text-anchor="start">People and payroll</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111110"/></marker></defs><rect x="180" y="110" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="190" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Answers five screening questions</text><text x="190" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Minimum age, work rights,</text><text x="190" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">availability, shifts per week,</text><text x="190" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">high-demand shift. A conversation,</text><text x="190" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">not a form.</text><rect x="442" y="110" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="452" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Picks an interview slot</text><text x="452" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Instant confirmation; reminders at</text><text x="452" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">24, 48 and 72 hours.</text><rect x="704" y="110" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="714" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Receives and accepts the offer</text><text x="714" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Generated and tracked</text><text x="714" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">automatically; nothing waits on</text><text x="714" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">paperwork.</text><rect x="966" y="110" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="976" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Uploads documents once</text><text x="976" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Guided capture for first-job</text><text x="976" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">candidates; consent handled before</text><text x="976" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">any decision.</text><rect x="1228" y="110" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="1238" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Starts the first shift</text><text x="1238" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Uniform, buddy and checklist ready;</text><text x="1238" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">attendance recorded.</text><rect x="180" y="240" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="190" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Screen and route</text><text x="190" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Auto-schedule if high-demand shift</text><text x="190" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">is yes and 3 to 5 shifts a week;</text><text x="190" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">otherwise to the review queue.</text><text x="190" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Under-age applicants go to parental</text><text x="190" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">consent first.</text><text x="400" y="252" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#b3261e" text-anchor="end">compliance-locked</text><rect x="442" y="240" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="452" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Schedule and remind</text><text x="452" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Calendar sync; 24, 48, 72 hour</text><text x="452" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">reminders; disposition after 10</text><text x="452" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">days without action.</text><rect x="704" y="240" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="714" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Generate the offer</text><text x="714" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Templated, tracked, surveys</text><text x="714" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">triggered on decline.</text><rect x="966" y="240" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="976" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Verify work rights</text><text x="976" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Document, biometric and registry</text><text x="976" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">checks; failures go to the human</text><text x="976" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">lane, never auto-rejected.</text><text x="1186" y="252" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#b3261e" text-anchor="end">compliance-locked</text><rect x="1228" y="240" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="1238" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Create the employee record</text><text x="1238" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Auto-created; pushed to scheduling</text><text x="1238" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">twice daily; payroll validation</text><text x="1238" y="308" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">pushes the full pack back on</text><text x="1238" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">failure.</text><rect x="180" y="370" width="230" height="72" rx="8" fill="#e8efff" stroke="#1d4ed8" stroke-width="1"/><text x="190" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Reviews the queue</text><text x="190" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Applicants outside the auto-</text><text x="190" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">schedule rule, with the answers</text><text x="190" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">attached.</text><rect x="442" y="370" width="230" height="72" rx="8" fill="#e8efff" stroke="#1d4ed8" stroke-width="1"/><text x="452" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Confirm, invite or reject</text><text x="452" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Three actions; no re-keying; the</text><text x="452" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">record travels.</text><rect x="704" y="370" width="230" height="72" rx="8" fill="#e8efff" stroke="#1d4ed8" stroke-width="1"/><text x="714" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Runs the interview</text><text x="714" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">A quiet space and a structured</text><text x="714" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">guide; rapport, not admin.</text><rect x="1228" y="370" width="230" height="72" rx="8" fill="#e8efff" stroke="#1d4ed8" stroke-width="1"/><text x="1238" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Runs day one</text><text x="1238" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">First-shift checklist; the finding</text><text x="1238" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">that day-one readiness needs an</text><text x="1238" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">owner.</text><rect x="966" y="500" width="230" height="72" rx="8" fill="#e8efff" stroke="#1d4ed8" stroke-width="1"/><text x="976" y="522" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Human review lane</text><text x="976" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Payroll admin accepts or rejects</text><text x="976" y="554" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">with a reason emailed; the hardest</text><text x="976" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">part of the experience gets a</text><text x="976" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">person.</text><rect x="1228" y="500" width="230" height="72" rx="8" fill="#fff" stroke="#111110" stroke-width="1"/><text x="1238" y="522" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110" text-anchor="start">Re-hire branch</text><text x="1238" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">Same franchisee group: skip work</text><text x="1238" y="554" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">rights and onboarding, transfer the</text><text x="1238" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">record. Otherwise the full</text><text x="1238" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a4a46" text-anchor="start">workflow.</text><path d="M410,146 L442,146" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M672,146 L704,146" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M934,146 L966,146" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M1196,146 L1228,146" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M295,182 L295,240" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M295,312 L295,370" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M1081,312 L1081,500" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M1081,182 L1081,240" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M557,312 L557,370" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M1343,182 L1343,240" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M1343,312 L1343,370" stroke="#111110" stroke-width="1.2" fill="none" marker-end="url(#a)"/><text x="20" y="626" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e6e69" text-anchor="start">Target-state workflow designed in 2022, drawn September 2026. KPIs specified: application-to-interview days, funnel drop-off, time to offer, first-shift attendance, 90-day retention. Concept diagram from the specification; not a screenshot of a live system.</text></svg>