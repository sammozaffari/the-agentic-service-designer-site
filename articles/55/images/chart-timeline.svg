<svg xmlns="http://www.w3.org/2000/svg" width="960" height="312" viewBox="0 0 960 312" role="img" aria-label="Sixteen weeks, five phases"><rect width="960" height="312" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Sixteen weeks, five phases</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Four weeks in restaurants before anything was designed.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Research</text><rect x="278" y="90" width="243.2" height="16" rx="2" fill="#3f5a7a"/><text x="529.2" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Synthesis</text><rect x="278" y="120" width="182.4" height="16" rx="2" fill="#cfcec7"/><text x="468.4" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3 wks</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Mapping and the moments verdict</text><rect x="278" y="150" width="182.4" height="16" rx="2" fill="#cfcec7"/><text x="468.4" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3 wks</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Ideation and workflow design</text><rect x="278" y="180" width="243.2" height="16" rx="2" fill="#cfcec7"/><text x="529.2" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">4 wks</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Specification and hand-over</text><rect x="278" y="210" width="121.6" height="16" rx="2" fill="#cfcec7"/><text x="407.6" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2 wks</text><text x="28.0" y="260.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">No ideation before the insights held, and no blueprint before the personas held up in rehearsal.</text><text x="28.0" y="279.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Timeline and gates, section 7 of this case study.</text></svg>